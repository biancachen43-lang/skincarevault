name: Bump Service Worker Version

on:
  push:
    branches: [main]

# Required so GITHUB_TOKEN can push commits back to the repo.
permissions:
  contents: write

jobs:
  bump-sw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CACHE_NAME with UTC timestamp
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          sed -i "s/const CACHE_NAME = 'skinku-[^']*'/const CACHE_NAME = 'skinku-${TIMESTAMP}'/" service-worker.js
          echo "SW version → skinku-${TIMESTAMP}"

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --quiet service-worker.js; then
            git add service-worker.js
            git commit -m "chore: bump SW cache version [auto]"
            git push
          else
            echo "service-worker.js unchanged — nothing to commit"
          fi
