name: Bump Service Worker Version

on:
  push:
    branches: [main]

jobs:
  bump-sw:
    runs-on: ubuntu-latest
    # GitHub Actions commits made with GITHUB_TOKEN don't re-trigger workflows,
    # so there is no infinite-loop risk here.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CACHE_NAME with UTC timestamp
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          sed -i "s/const CACHE_NAME = 'skinku-[^']*'/const CACHE_NAME = 'skinku-${TIMESTAMP}'/" service-worker.js
          echo "SW version bumped to skinku-${TIMESTAMP}"

      - name: Commit if service-worker.js changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --quiet service-worker.js; then
            git add service-worker.js
            git commit -m "chore: bump SW cache version [auto]"
            git push
          else
            echo "No change to service-worker.js — skipping commit"
          fi
