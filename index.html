<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SkinKu">
<meta name="theme-color" content="#48281A">
<title>SkinKu 保養酷</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* ── Earth palette ── */
  --cream:#F5EFE6;
  --paper:#FBF7EE;
  --paper-2:#F0E8DA;
  --cocoa:#2A1F18;
  --cocoa-2:#4A3828;
  --muted:#7A6651;
  --muted-2:#A8927A;
  --hairline:rgba(58,42,31,0.10);
  --hairline-strong:rgba(58,42,31,0.18);
  /* ── Accent ── */
  --rust:#9C5E2E;
  /* ── Gradient stops (honey) ── */
  --grad-deep:#48281A;--grad-mid:#9C5E33;--grad-warm:#E8B477;
  /* ── Legacy aliases so existing render fns keep working ── */
  --accent:var(--rust);
  --accent-light:#FDF3E3;--accent-mid:#D4A87A;
  --purple:var(--rust);--purple-light:#FDF3E3;--purple-mid:#D4A87A;
  --teal:#3A8C6E;--teal-light:#EBF5F0;
  --amber:var(--rust);--amber-light:#FDF3E3;
  --coral:#A85848;--coral-light:#F7EAE6;
  --red:#A84848;--red-light:#F7E8E8;
  --bg:var(--cream);--bg2:var(--paper);--bg3:var(--paper-2);
  --text:var(--cocoa);--text2:var(--cocoa-2);--text3:var(--muted);
  --border:var(--hairline);--border2:var(--hairline-strong);
  --btn:var(--cocoa);
  /* ── Typography ── */
  --sans:"Hanken Grotesk","Noto Sans TC",-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
  /* ── Radii ── */
  --r-card:20px;--r-chip:999px;--r-tile:14px;
  --radius:var(--r-card);--radius-sm:10px;
}
/* ── Base ── */
body{font-family:var(--sans);background:var(--cream);color:var(--cocoa);min-height:100vh;width:100%;margin:0;padding:0;font-weight:400;-webkit-font-smoothing:antialiased;}
em{font-style:normal;font-weight:400;color:var(--muted);}
.app{min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;background:var(--cream);width:100%;}
/* ── Header ── */
.topbar{background:linear-gradient(135deg,#48281A 0%,#9C5E33 50%,#E8B477 100%);padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 26px;position:sticky;top:0;z-index:10;width:100%;overflow:hidden;}
.topbar::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(255,220,190,0.10) 0%,transparent 55%);pointer-events:none;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:relative;z-index:1;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-wordmark{display:flex;flex-direction:column;gap:3px;}
.topbar-title{font-family:var(--sans);font-size:22px;font-weight:600;letter-spacing:-0.02em;color:#F5EFE6;line-height:1;}
.topbar-sub{font-size:11px;color:rgba(245,239,230,0.72);letter-spacing:0.36em;font-weight:300;}
.topbar-eyebrow{font-family:var(--mono);font-size:9.5px;color:rgba(245,239,230,0.55);letter-spacing:0.22em;text-transform:uppercase;margin-bottom:6px;position:relative;z-index:1;}
.topbar-date{font-size:13px;color:rgba(245,239,230,0.78);font-weight:400;letter-spacing:0.01em;position:relative;z-index:1;}
.topbar-greeting{font-size:16px;color:rgba(245,239,230,0.92);font-weight:300;line-height:1.45;margin-top:10px;position:relative;z-index:1;}
.topbar-avatar{width:38px;height:38px;border-radius:50%;background:rgba(245,239,230,0.15);border:0.5px solid rgba(245,239,230,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;color:#F5EFE6;font-weight:500;flex-shrink:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.nav{display:none;}
/* ── Bottom Nav ── */
.bottom-nav-wrap{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:0 14px calc(22px + env(safe-area-inset-bottom,0)) 14px;background:transparent;pointer-events:none;}
.bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(251,247,238,0.82);border-radius:28px;padding:8px;pointer-events:auto;border:0.5px solid var(--hairline-strong);box-shadow:0 1px 0 rgba(255,255,255,0.6) inset,0 10px 30px rgba(31,20,16,0.10),0 2px 8px rgba(31,20,16,0.04);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);}
.bnav-btn{padding:10px 6px;font-size:10px;color:var(--muted);background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--sans);font-weight:500;letter-spacing:0.02em;border-radius:22px;transition:background 0.25s ease,color 0.25s ease;}
.bnav-btn svg{stroke:var(--muted);transition:stroke 0.25s ease;}
.bnav-btn.active{background:linear-gradient(160deg,#2A1F18 0%,#4A3828 100%);color:#FBF7EE;box-shadow:0 4px 12px rgba(31,20,16,0.18),inset 0 1px 0 rgba(255,255,255,0.08);}
.bnav-btn.active svg{stroke:#FBF7EE;}
.nav-icon{display:flex;align-items:center;justify-content:center;}
/* ── Content ── */
.content{padding:22px;flex:1;padding-bottom:110px;}
@keyframes tabIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.tab-content{animation:tabIn 320ms cubic-bezier(0.2,0.7,0.2,1) both;}
/* ── Typography utilities ── */
.eyebrow{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--muted-2);letter-spacing:0.22em;text-transform:uppercase;line-height:1;}
.dot{opacity:0.5;}
.section-title{font-family:var(--sans);font-size:24px;font-weight:500;color:var(--cocoa);letter-spacing:-0.02em;line-height:1.15;}
.numeral{font-family:var(--sans);font-size:44px;font-weight:300;letter-spacing:-0.04em;line-height:0.9;color:var(--cocoa);font-feature-settings:"tnum","lnum";}
/* ── Cards ── */
.card{background:var(--paper);border:0.5px solid var(--hairline);border-radius:var(--r-card);padding:18px 20px;margin-bottom:14px;}
.card-title{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--muted-2);margin-bottom:14px;letter-spacing:0.22em;text-transform:uppercase;}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-label{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0.08em;}
/* ── Chips + Tags ── */
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:var(--r-chip);background:var(--paper-2);border:0.5px solid var(--hairline-strong);font-family:var(--sans);font-size:11px;font-weight:500;color:var(--cocoa-2);}
.tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:var(--r-chip);font-weight:500;letter-spacing:0.01em;}
.tok{background:var(--teal-light);color:#2A6E58;}
.twarn{background:var(--amber-light);color:#6B4010;}
.tdanger{background:var(--red-light);color:#6B2020;}
.tgray{background:var(--paper-2);color:var(--muted);}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:14px;border:0.5px solid var(--hairline-strong);background:transparent;color:var(--cocoa-2);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:transform 0.15s;letter-spacing:-0.005em;}
.btn:active,.add-btn:active,.submit-btn:active,.save-btn:active{transform:scale(0.97);}
.btn-dark{background:linear-gradient(160deg,#2A1F18 0%,#4A3828 100%);color:#FBF7EE;border-color:transparent;}
.btn-ghost{background:transparent;color:var(--muted);}
.add-btn{background:linear-gradient(160deg,#2A1F18 0%,#4A3828 100%);color:#FBF7EE;border:none;border-radius:14px;padding:10px 16px;font-size:12px;cursor:pointer;font-family:var(--sans);font-weight:500;letter-spacing:-0.005em;white-space:nowrap;flex-shrink:0;transition:transform 0.15s;}
/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:14px;background:var(--paper);border:0.5px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;}
.stat{padding:16px 6px;text-align:center;border-right:0.5px solid var(--hairline);}
.stat:last-child{border-right:none;}
.stat-n{font-size:36px;font-weight:300;color:var(--cocoa);font-family:var(--sans);letter-spacing:-0.04em;line-height:0.9;font-feature-settings:"tnum","lnum";}
.stat-l{font-size:9px;color:var(--muted);margin-top:6px;letter-spacing:0.03em;font-weight:400;}
.stat-sub{font-size:8px;font-family:var(--mono);color:var(--muted-2);letter-spacing:0.14em;text-transform:uppercase;margin-top:2px;}
/* ── Skin banner ── */
.skin-banner{background:var(--paper);border:0.5px solid var(--hairline);border-radius:var(--r-card);padding:16px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.skin-val{font-size:17px;font-weight:500;color:var(--cocoa);letter-spacing:-0.005em;}
.skin-sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:400;}
.skin-btn{font-size:11px;color:var(--muted);background:transparent;border:0.5px solid var(--hairline-strong);border-radius:var(--r-chip);padding:5px 12px;cursor:pointer;letter-spacing:0.02em;font-weight:400;white-space:nowrap;}
/* ── Alert banners ── */
.alert-banner{border-radius:var(--r-card);padding:16px 18px;margin-bottom:14px;font-size:12px;display:flex;align-items:flex-start;gap:10px;font-weight:400;border:0.5px solid;}
.alert-warn{background:linear-gradient(135deg,#FDF3E3,#FAE8C8);border-color:rgba(156,94,46,0.20);color:#5A3810;}
.alert-danger{background:var(--red-light);border-color:rgba(168,72,72,0.25);color:#6B2020;}
.alert-icon{flex-shrink:0;margin-top:2px;display:flex;}
.alert-title{font-weight:500;margin-bottom:3px;letter-spacing:0.01em;font-size:13px;}
/* ── Product list + cards ── */
.product-list{display:flex;flex-direction:column;gap:10px;}
.pcard{background:var(--paper);border:0.5px solid var(--hairline);border-radius:var(--r-card);display:flex;align-items:flex-start;gap:14px;padding:16px;cursor:pointer;position:relative;}
.pcard-emoji{width:56px;height:56px;border-radius:12px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:0.5px solid var(--hairline);}
.pcard-emoji img{width:100%;height:100%;object-fit:cover;}
.pcard-emoji svg{width:22px;height:22px;stroke:var(--muted-2);}
.pcard-body{flex:1;min-width:0;}
.pcard-brand{font-size:9px;color:var(--muted-2);letter-spacing:0.18em;text-transform:uppercase;font-family:var(--mono);font-weight:400;}
.pcard-name{font-size:15px;font-weight:500;color:var(--cocoa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.005em;line-height:1.25;margin-top:3px;}
.pcard-bar-wrap{display:flex;align-items:center;gap:8px;margin-top:10px;}
.pbar{flex:1;height:1px;background:var(--hairline);overflow:hidden;border-radius:1px;}
.pbar-fill{height:100%;border-radius:1px;}
/* ── Progress ── */
.progress-rail{flex:1;height:1px;background:var(--hairline);border-radius:1px;overflow:hidden;}
.progress-fill{height:100%;background:var(--rust);border-radius:1px;}
/* ── Photo placeholder ── */
.photo{background:var(--paper-2);border:0.5px solid var(--hairline);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--mono);font-size:8px;color:var(--muted-2);letter-spacing:0.08em;text-transform:uppercase;}
.photo.round{border-radius:50%;}
/* ── Scroll helpers ── */
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
.hscroll::-webkit-scrollbar{display:none;}
/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(42,31,24,.48);z-index:100;display:flex;align-items:flex-end;}
.modal{background:var(--paper);border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:22px 20px 40px;}
.modal-handle{width:36px;height:3px;background:var(--hairline-strong);border-radius:2px;margin:0 auto 18px;}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:17px;font-weight:500;color:var(--cocoa);letter-spacing:-0.005em;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:4px;}
/* ── Form ── */
.fl{font-family:var(--mono);font-size:9.5px;color:var(--muted-2);margin-bottom:8px;display:block;font-weight:400;letter-spacing:0.22em;text-transform:uppercase;}
.fi{width:100%;border:0.5px solid var(--hairline-strong);border-radius:14px;padding:11px 14px;font-size:15px;font-family:var(--sans);color:var(--cocoa);background:var(--paper);margin-bottom:14px;-webkit-appearance:none;font-weight:400;}
.fi:focus{outline:none;border-color:var(--cocoa);}
.fi-opt{border-style:dashed;opacity:0.75;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.expiry-hint{font-size:12px;color:var(--muted);background:var(--paper-2);border-radius:14px;padding:10px 14px;margin-bottom:14px;line-height:1.5;font-weight:400;}
.field-label{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--muted-2);letter-spacing:0.22em;text-transform:uppercase;margin-bottom:10px;display:block;}
.field-input{width:100%;border:none;border-bottom:0.5px solid var(--hairline-strong);padding:4px 0 10px;font-family:var(--sans);font-size:20px;font-weight:500;color:var(--cocoa);background:transparent;outline:none;letter-spacing:-0.01em;}
/* ── Option tiles ── */
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.opt-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.opt-btn,.option-tile{padding:12px 8px;border:0.5px solid var(--hairline-strong);border-radius:var(--r-tile);font-size:13px;cursor:pointer;text-align:center;background:var(--paper);color:var(--cocoa-2);font-family:var(--sans);font-weight:500;transition:background 0.15s,color 0.15s,border-color 0.15s;letter-spacing:-0.005em;}
.opt-btn.sel,.option-tile.active{background:var(--cocoa);color:#FBF7EE;border-color:var(--cocoa);}
/* ── Segments ── */
.tabs{display:flex;border:0.5px solid var(--hairline-strong);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.tab-btn{flex:1;padding:10px 4px;font-size:11px;background:none;border:none;cursor:pointer;font-family:var(--sans);color:var(--muted);font-weight:500;letter-spacing:0.02em;}
.tab-btn.active{background:var(--cocoa);color:#FBF7EE;}
.advice-seg{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;gap:6px;margin-bottom:20px;padding-bottom:2px;}
.advice-seg::-webkit-scrollbar{display:none;}
.aseg-btn{flex-shrink:0;padding:10px 12px 8px;font-size:9px;background:transparent;border:0.5px solid var(--hairline-strong);border-radius:14px;cursor:pointer;font-family:var(--sans);color:var(--muted);font-weight:500;letter-spacing:0.04em;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background 0.15s,color 0.15s;}
.aseg-btn.active{background:var(--cocoa);color:#FBF7EE;border-color:var(--cocoa);}
.aseg-btn.active svg{stroke:#FBF7EE;}
.seg-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.seg-tag{padding:7px 16px;border:0.5px solid var(--hairline-strong);border-radius:var(--r-chip);font-size:11px;cursor:pointer;color:var(--muted);background:transparent;font-family:var(--sans);font-weight:500;letter-spacing:0.02em;transition:all 0.15s;}
.seg-tag.active{background:var(--cocoa);color:#FBF7EE;border-color:var(--cocoa);}
/* ── Detail page ── */
.det-hero{width:100%;height:160px;background:var(--paper-2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden;border:0.5px solid var(--hairline);}
.det-hero img{width:100%;height:100%;object-fit:cover;}
.det-brand{font-size:10px;color:var(--muted-2);letter-spacing:0.18em;font-weight:400;text-transform:uppercase;font-family:var(--mono);}
.det-name{font-size:20px;font-weight:500;color:var(--cocoa);margin-bottom:14px;letter-spacing:-0.015em;line-height:1.2;}
.det-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--hairline);font-size:14px;}
.det-k{color:var(--muted);font-weight:400;}
.det-v{color:var(--cocoa);font-weight:500;}
.infobox{border-radius:16px;padding:14px 16px;margin-top:12px;}
.infobox-purple{background:var(--paper-2);border:0.5px solid var(--hairline-strong);}
.infobox-coral{background:var(--coral-light);border:0.5px solid rgba(168,88,72,0.2);}
.infobox-teal{background:var(--teal-light);border:0.5px solid rgba(58,140,110,0.2);}
.infobox-title{font-size:11px;font-weight:500;margin-bottom:6px;letter-spacing:0.04em;}
.infobox-purple .infobox-title{color:var(--cocoa-2);}
.infobox-coral .infobox-title{color:var(--coral);}
.infobox-teal .infobox-title{color:var(--teal);}
.infobox-body{font-size:12px;line-height:1.7;font-weight:400;color:var(--cocoa-2);}
/* ── Routine step ── */
.routine-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;}
.step-num{width:22px;height:22px;border-radius:50%;background:none;border:0.5px solid var(--hairline-strong);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:400;flex-shrink:0;margin-top:3px;}
.step-body{flex:1;}
.step-title{font-size:17px;font-weight:500;color:var(--cocoa);margin-bottom:4px;letter-spacing:-0.005em;}
.step-desc{font-size:13px;color:var(--cocoa-2);line-height:1.6;font-weight:400;}
.step-product{font-size:12px;color:var(--rust);margin-top:6px;font-weight:400;}
/* ── Advice cards ── */
.advice-card{background:var(--paper);border:0.5px solid var(--hairline);border-radius:var(--r-card);padding:16px 18px;margin-bottom:10px;}
.ac-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ac-icon{width:16px;height:16px;color:var(--rust);flex-shrink:0;}
.ac-title{font-size:14px;font-weight:500;color:var(--cocoa);letter-spacing:-0.005em;}
.ac-body{font-size:12px;color:var(--muted);line-height:1.7;font-weight:400;}
/* ── Compat ── */
.compat-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--hairline);}
.compat-item:last-child{border:none;}
.compat-icon{font-size:16px;flex-shrink:0;margin-top:2px;}
.compat-title{font-size:14px;font-weight:500;color:var(--cocoa);margin-bottom:3px;}
.compat-desc{font-size:12px;color:var(--muted);line-height:1.5;font-weight:400;}
/* ── Settings ── */
.condition-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.cond-btn{padding:11px 8px;border:0.5px solid var(--hairline-strong);border-radius:var(--r-tile);font-size:14px;cursor:pointer;text-align:center;background:var(--paper);color:var(--cocoa-2);font-family:var(--sans);font-weight:500;}
.save-btn{width:100%;background:linear-gradient(160deg,#2A1F18 0%,#4A3828 100%);color:#FBF7EE;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--sans);margin-top:6px;letter-spacing:-0.005em;transition:transform 0.15s;}
.submit-btn{width:100%;background:linear-gradient(160deg,#2A1F18 0%,#4A3828 100%);color:#FBF7EE;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--sans);margin-top:4px;letter-spacing:-0.005em;transition:transform 0.15s;}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;}
.ghost-btn{width:100%;background:none;border:0.5px solid var(--hairline-strong);border-radius:14px;padding:11px;font-size:14px;cursor:pointer;color:var(--muted);font-family:var(--sans);margin-top:8px;font-weight:400;}
.edit-btn{width:100%;background:var(--paper-2);border:0.5px solid var(--hairline);color:var(--cocoa);border-radius:14px;padding:11px;font-size:14px;cursor:pointer;margin-top:8px;font-family:var(--sans);font-weight:400;}
.danger-btn{width:100%;background:none;border:0.5px solid rgba(168,72,72,0.3);color:#8B4040;border-radius:14px;padding:11px;font-size:14px;cursor:pointer;margin-top:8px;font-family:var(--sans);font-weight:400;}
/* ── Reminders ── */
.reminder-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:0.5px solid var(--hairline);}
.reminder-row:last-of-type{border:none;}
.reminder-label{font-size:14px;font-weight:500;color:var(--cocoa);}
.reminder-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.toggle{width:40px;height:24px;background:var(--hairline-strong);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;outline:none;}
.toggle.on{background:var(--rust);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:white;border-radius:50%;top:3px;left:3px;transition:left .2s;}
.toggle.on::after{left:19px;}
.time-input{border:0.5px solid var(--hairline-strong);border-radius:10px;padding:7px 10px;font-size:14px;font-family:var(--sans);color:var(--cocoa);background:var(--paper);font-weight:400;}
/* ── Lifestyle ── */
.lifestyle-section-title{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--rust);margin:18px 0 10px;letter-spacing:0.18em;text-transform:uppercase;}
.lifestyle-row{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:0.5px solid var(--hairline);}
.lifestyle-row:last-child{border-bottom:none;padding-bottom:0;}
.lifestyle-label{font-size:14px;color:var(--cocoa-2);font-weight:400;}
.lifestyle-select{background:var(--paper);border:0.5px solid var(--hairline-strong);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--cocoa);font-family:var(--sans);font-weight:400;cursor:pointer;}
/* ── Misc ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;font-weight:400;letter-spacing:0.04em;}
.empty-icon{display:flex;justify-content:center;margin-bottom:14px;opacity:0.35;}
.divider{border:none;border-top:0.5px solid var(--hairline);margin:16px 0;}
.sbox{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.5;font-weight:400;}
.sloading{background:var(--paper-2);border:0.5px solid var(--hairline);color:var(--muted);}
.ssuccess{background:var(--teal-light);border:0.5px solid rgba(58,140,110,0.25);color:#2A6E58;}
.swarn{background:var(--amber-light);border:0.5px solid rgba(156,94,46,0.25);color:#6B4010;}
.sinfo{background:var(--paper-2);border:0.5px solid var(--hairline);color:var(--muted);}
.search-wrap{display:flex;gap:10px;margin-bottom:14px;}
.search-input{flex:1;border:0.5px solid var(--hairline-strong);border-radius:14px;padding:11px 14px;font-size:15px;font-family:var(--sans);color:var(--cocoa);background:var(--paper);font-weight:400;}
.search-btn{background:linear-gradient(160deg,#2A1F18 0%,#4A3828 100%);color:#FBF7EE;border:none;border-radius:14px;padding:11px 18px;font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap;font-weight:500;letter-spacing:0.04em;}
.search-btn:disabled{opacity:.4;}
.rcard{border:0.5px solid var(--hairline);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px;cursor:pointer;background:var(--paper);}
.rcard.sel{border-color:var(--rust);background:var(--paper-2);}
.rcard-name{font-size:15px;font-weight:500;color:var(--cocoa);margin-bottom:3px;letter-spacing:-0.005em;}
.rcard-brand{font-size:10px;color:var(--muted-2);margin-bottom:5px;letter-spacing:0.18em;font-family:var(--mono);text-transform:uppercase;}
.rcard-desc{font-size:12px;color:var(--muted);line-height:1.5;font-weight:400;}
.rcard-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.rtag{font-size:10px;padding:3px 8px;background:var(--paper-2);color:var(--muted);border-radius:var(--r-chip);}
.upload-area{border:0.5px dashed var(--hairline-strong);border-radius:14px;padding:26px;text-align:center;margin-bottom:14px;cursor:pointer;background:var(--paper-2);position:relative;min-height:90px;}
.upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-icon{margin-bottom:8px;opacity:0.4;}
.upload-text{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0.06em;}
.dot-anim{animation:blink 1s infinite;display:inline-block;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dots-seq span{display:inline-block;animation:dot-seq 1.2s infinite both;}
.dots-seq span:nth-child(2){animation-delay:.2s;}
.dots-seq span:nth-child(3){animation-delay:.4s;}
@keyframes dot-seq{0%,60%,100%{opacity:.15}30%{opacity:1}}
</style>
</head>
<body>

<script>
const API_ENDPOINT='/api/claude';
// NO EMOJI POLICY: All icons must use SVG line icons (stroke-width:1.5, fill:none). No emoji in UI.
const STORAGE_KEY='skincarevault_v2';

// User ID — one per device, persisted in localStorage
(function(){let id=localStorage.getItem('sv_user_id');if(!id){id='user_'+Math.random().toString(36).slice(2,10);localStorage.setItem('sv_user_id',id);}window._userId=id;})();

// 雲端儲存
async function saveToCloud(data) {
  const res = await fetch('/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'save', data, userId: window._userId })
  });
  if(!res.ok) throw new Error('Save failed');
  return true;
}

async function loadFromCloud() {
  try {
    const res = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'load', userId: window._userId })
    });
    const json = await res.json();
    return json.data || null;
  } catch(e) { return null; }
}

function loadState(){
  try{
    const r=localStorage.getItem(STORAGE_KEY);
    if(r){const d=JSON.parse(r);if(d&&d.products)return d;}
    const keys=['skincarevault_v1','skincarevault_v2','skincarevault'];
    for(const k of keys){
      if(k===STORAGE_KEY)continue;
      try{const d=JSON.parse(localStorage.getItem(k)||'');if(d&&d.products&&d.products.length>0){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d;}}catch(e){}
    }
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k===STORAGE_KEY)continue;
      try{const d=JSON.parse(localStorage.getItem(k));if(d&&d.products&&Array.isArray(d.products)&&d.products.length>0){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d;}}catch(e){}
    }
  }catch(e){}
  return null;
}

function serializeState(s){const{tab:_,...rest}=s;return JSON.stringify(rest);}
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,serializeState(state));}catch(e){}
  // 只有使用者有真實資料時才存到雲端（id > 3 代表是使用者自己新增的）
  const hasRealData = state.products.some(p=>p.id>3);
  if(hasRealData){
    saveToCloud(state);
  }
}

function _adviceCacheKey(){return state.skin.type+'|'+state.skin.concerns.join(',')+'|'+state.products.map(p=>p.id).sort().join(',');}
function _saveOne(lsKey,val){try{localStorage.setItem(lsKey,JSON.stringify({k:_adviceCacheKey(),v:val}));}catch(e){}}
function _loadOne(lsKey){try{const c=JSON.parse(localStorage.getItem(lsKey)||'null');return(c&&c.k===_adviceCacheKey())?c.v:null;}catch(e){return null;}}
function saveAdviceCache(){
  _saveOne('sv_cache_morning',window._routine_morning||null);
  _saveOne('sv_cache_evening',window._routine_evening||null);
  _saveOne('sv_cache_week',window._weekplan||null);
  _saveOne('sv_cache_compat',window._compat||null);
  _saveOne('sv_cache_compat_text',window._compatText||null);
  _saveOne('sv_cache_device',window._device_advice||null);
  _saveOne('sv_cache_device_sched',window._device_schedule||null);
}
function loadAdviceCache(){
  const rm=_loadOne('sv_cache_morning');if(rm)window._routine_morning=rm;
  const re=_loadOne('sv_cache_evening');if(re)window._routine_evening=re;
  const wp=_loadOne('sv_cache_week');if(wp)window._weekplan=wp;
  const cp=_loadOne('sv_cache_compat');if(cp)window._compat=cp;
  const ct=_loadOne('sv_cache_compat_text');if(ct)window._compatText=ct;
  const da=_loadOne('sv_cache_device');if(da)window._device_advice=da;
  const ds=_loadOne('sv_cache_device_sched');if(ds)window._device_schedule=ds;
}
function clearAdviceCache(){
  window._routine_morning=null;window._routine_evening=null;window._weekplan=null;window._compat=null;window._compatText=null;window._device_advice=null;window._device_schedule=null;
  state.skinAdvice=null;
  ['sv_cache_morning','sv_cache_evening','sv_cache_week','sv_cache_compat','sv_cache_compat_text','sv_cache_device','sv_cache_device_sched','sv_cache_skin_advice','skincarevault_advice_cache'].forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
}
// Confirmed plan helpers
function _planFingerprint(){
  const prodHash=state.products.map(p=>p.id+'|'+p.category).sort().join(',');
  const activeHash=(state.productPlan&&state.productPlan.activeIds)?state.productPlan.activeIds.slice().sort().join('+'):'none';
  return prodHash+'::'+activeHash;
}
function saveConfirmedPlanLocal(plan){try{localStorage.setItem('sv_confirmed_plan',JSON.stringify(plan));}catch(e){}}
function loadConfirmedPlanLocal(){try{return JSON.parse(localStorage.getItem('sv_confirmed_plan')||'null');}catch(e){return null;}}
async function saveConfirmedPlanCloud(plan){try{await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save_plan',data:plan,userId:window._userId})});}catch(e){console.warn('[plan] cloud save failed:',e);}}
async function loadConfirmedPlanCloud(){try{const r=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'load_plan',userId:window._userId})});const j=await r.json();return j.data||null;}catch(e){return null;}}
async function confirmPlan(){
  if(!window._routine_morning||!window._routine_evening||!window._weekplan)return;
  const plan={confirmedAt:new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}),productFingerprint:_planFingerprint(),morning:window._routine_morning,evening:window._routine_evening,weekplan:window._weekplan};
  window._confirmedPlan=plan;
  saveConfirmedPlanLocal(plan);
  await saveConfirmedPlanCloud(plan);
  const adviceEl=document.getElementById('advice-content');
  if(adviceEl)adviceEl.innerHTML=renderAdviceContent();
}
function keepExistingPlan(){
  if(!window._confirmedPlan)return;
  window._confirmedPlan.productFingerprint=_planFingerprint();
  saveConfirmedPlanLocal(window._confirmedPlan);
  saveConfirmedPlanCloud(window._confirmedPlan);
  render();
}
function regenPlan(startTab){window._confirmedPlan=null;clearAllRoutines();generateAll(startTab||'morning');}

// Smart product planning helpers
function getActiveSkinProds(){
  const plan=state.productPlan;
  if(plan&&plan.activeIds&&plan.activeIds.length>0)return state.products.filter(p=>plan.activeIds.includes(p.id));
  return state.products.filter(p=>p.category!=='美容儀器');
}
function getProductPlanStatus(p){
  const plan=state.productPlan;
  if(!plan||(!plan.activeIds.length&&!plan.standbyIds.length))return'unplanned';
  if(plan.activeIds.includes(p.id))return'active';
  const d=daysLeft(p);
  if(d!==null&&d<=30)return'expiry-warning';
  return'standby';
}
function planStatusTagHtml(p){
  if(p.category==='美容儀器')return'';
  const s=getProductPlanStatus(p);
  if(s==='unplanned')return'';
  const svgSwitch=`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:4px;vertical-align:middle;flex-shrink:0;"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>`;
  const hint=`<div style="font-size:10px;color:var(--text2);margin-top:3px;line-height:1.2;">點擊切換狀態</div>`;
  const base='cursor:pointer;font-size:10px;padding:2px 8px;margin-top:4px;display:inline-flex;align-items:center;border:none;transition:transform 0.12s,opacity 0.12s;active:scale(0.92);';
  if(s==='active')return`<div onclick="event.stopPropagation();toggleProductPlan(${p.id})" style="display:inline-block;"><button class="tag" style="background:rgba(99,102,241,0.12);color:#6366f1;border:1px solid rgba(99,102,241,0.25);${base}" onmousedown="this.style.transform='scale(0.88)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.88)'" ontouchend="this.style.transform=''">使用中${svgSwitch}</button>${hint}</div>`;
  if(s==='expiry-warning')return`<div onclick="event.stopPropagation();toggleProductPlan(${p.id})" style="display:inline-block;"><button class="tag twarn" style="${base}" onmousedown="this.style.transform='scale(0.88)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.88)'" ontouchend="this.style.transform=''">效期警示${svgSwitch}</button>${hint}</div>`;
  return`<div onclick="event.stopPropagation();toggleProductPlan(${p.id})" style="display:inline-block;"><button class="tag tgray" style="${base}" onmousedown="this.style.transform='scale(0.88)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.88)'" ontouchend="this.style.transform=''">待用${svgSwitch}</button>${hint}</div>`;
}
function toggleProductPlan(id){
  const plan=state.productPlan;
  if(!plan)return;
  if(plan.activeIds.includes(id)){
    plan.activeIds=plan.activeIds.filter(x=>x!==id);
    if(!plan.standbyIds.includes(id))plan.standbyIds.push(id);
  }else{
    plan.standbyIds=plan.standbyIds.filter(x=>x!==id);
    if(!plan.activeIds.includes(id))plan.activeIds.push(id);
  }
  plan.userModified=true;
  // Force the advice banner to appear regardless of which tab is active
  if(window._confirmedPlan)window._confirmedPlan.productFingerprint='';
  saveState();render();
  // If advice tab is open, refresh advice-content so the banner renders immediately
  if(state.tab==='advice'){const el=document.getElementById('advice-content');if(el)el.innerHTML=renderAdviceContent();}
}
async function planProducts(){
  const skinProds=state.products.filter(p=>p.category!=='美容儀器');
  if(!skinProds.length)return;
  window._planningLoading=true;render();
  const prodList=skinProds.map(p=>{
    const d=daysLeft(p);
    const expInfo=d===null?'未設定效期':d<0?'已過期':`剩 ${d} 天`;
    return`ID:${p.id} ${p.brand} ${p.name}（${p.category}，${expInfo}${p.ingredients?'，成分：'+p.ingredients:''}）`;
  }).join('\n');
  try{
    const raw=await callClaude(`你是一位專業保養師。請從以下保養品中，根據效期緊急程度、成分相容性和功效互補性，智慧挑選「當前使用清單」。

【挑選原則】
1. 效期越近的產品優先納入使用清單
2. 功效相近的同類產品（如多瓶精華）→ 選最適合的放入輪替，不全部同時使用
3. 功效互補的產品（如化妝水+精華+乳霜）→ 可同時納入不同步驟
4. 已過期的產品不納入使用清單

【用戶膚質】膚質：${state.skin.type}，困擾：${state.skin.concerns.join('、')}

【產品庫】
${prodList}

只回純JSON，active 為現在應使用的產品 ID 陣列，standby 為暫時待命的 ID 陣列（所有 ID 必須分配完畢）：
{"active":[1,2],"standby":[3,4]}`);
    const data=parseJSON(raw);
    const activeIds=(data.active||[]).map(Number);
    const standbyIds=(data.standby||[]).map(Number).filter(id=>!activeIds.includes(id));
    const allIds=skinProds.map(p=>p.id);
    const unassigned=allIds.filter(id=>!activeIds.includes(id)&&!standbyIds.includes(id));
    state.productPlan={activeIds,standbyIds:[...standbyIds,...unassigned],plannedAt:new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}),userModified:false};
    saveState();
  }catch(e){console.error('[planProducts]',e);}
  window._planningLoading=false;render();
}
function togglePlanningCard(){window._planningCardOpen=!window._planningCardOpen;renderProductsSection();}
function renderProductsSection(){document.getElementById('main-content').innerHTML=renderProducts();updateTopbar();}
function renderPlanningCard(){
  const skinProds=state.products.filter(p=>p.category!=='美容儀器');
  if(!skinProds.length)return'';
  if(window._planningLoading)return`<div class="card" style="text-align:center;padding:20px 16px;"><div style="font-size:14px;color:var(--text2);font-weight:300;">使用清單規劃中，請稍候<span class="dots-seq"><span>．</span><span>．</span><span>．</span></span></div></div>`;
  const plan=state.productPlan;
  const hasplan=plan&&(plan.activeIds.length||plan.standbyIds.length);
  if(hasplan){
    const open=!!window._planningCardOpen;
    const expiredActive=state.products.filter(p=>plan.activeIds.includes(p.id)&&daysLeft(p)!==null&&daysLeft(p)<0);
    const expiredDot=expiredActive.length?`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#C0392B;margin-left:6px;vertical-align:middle;"></span>`:'';
    const modBadge=plan.userModified?`<span style="font-size:11px;color:var(--text2);margin-left:6px;">已調整</span>`:'';
    const chevron=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;transform:rotate(${open?'180':'0'}deg);flex-shrink:0;"><polyline points="6 9 12 15 18 9"/></svg>`;
    const header=`<div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;" onclick="togglePlanningCard()"><div style="display:flex;align-items:center;gap:4px;"><span style="font-size:13px;font-weight:500;color:var(--text);">智慧使用清單</span>${modBadge}${expiredDot}</div><div style="display:flex;align-items:center;gap:6px;"><span style="font-size:12px;color:var(--text2);">使用中 ${plan.activeIds.length} · 待用 ${plan.standbyIds.length}</span>${chevron}</div></div>`;
    if(!open)return`<div class="card" style="margin-bottom:12px;padding:12px 14px;">${header}</div>`;

async function initFromCloud(){

    if(hasCloudData){
      // 既有用戶：從雲端載入資料
      state={...DEFAULT,...cloudData};

      state.tab='home';
      try{localStorage.setItem(STORAGE_KEY,serializeState(state));}catch(e){}
      render();
    } else {
      // 雲端無此用戶資料
      const hasRealLocal=state.products.some(p=>p.id>3);
      if(hasRealLocal){
        // 本機有真實資料（如從舊版遷移）→ 視為既有用戶，同步到雲端
        saveState();
      } else if(!localStorage.getItem('sv_onboarding_done_'+window._userId)){
        // 真正的新用戶 → 顯示歡迎引導
        showWelcomeDialog();
      }
    }
    // load confirmed plan from cloud if not already in localStorage
    if(!window._confirmedPlan){
      const cloudPlan=await loadConfirmedPlanCloud();
      if(cloudPlan){
        window._confirmedPlan=cloudPlan;
        saveConfirmedPlanLocal(cloudPlan);
        if(!window._routine_morning)window._routine_morning=cloudPlan.morning;
        if(!window._routine_evening)window._routine_evening=cloudPlan.evening;
        if(!window._weekplan)window._weekplan=cloudPlan.weekplan;

    // 網路失敗時，若本機也無真實資料且未完成引導 → 顯示歡迎
    if(!localStorage.getItem('sv_onboarding_done_'+window._userId)&&!state.products.some(p=>p.id>3)){

function computeExpiry(p){
  // Priority: openedDate+PAO > mfgDate+PAO > explicit expiryDate > null
  if(p.openedDate&&p.pao){const d=new Date(p.openedDate);d.setMonth(d.getMonth()+parseInt(p.pao));return d;}
  if(p.mfgDate&&p.pao){const d=new Date(p.mfgDate);d.setMonth(d.getMonth()+parseInt(p.pao));return d;}
  if(p.expiryDate)return new Date(p.expiryDate);
  return null;
}
function daysLeft(p){const e=computeExpiry(p);if(!e)return null;return Math.floor((e-new Date())/86400000);}
function expStatus(d){if(d===null)return 'unknown';if(d<0)return 'expired';if(d<=30)return 'danger';if(d<=60)return 'warn';return 'ok';}
function expColor(s){return s==='ok'?'#3A8C6E':s==='warn'?'#A07820':s==='unknown'?'#C4B8B0':'#A84848';}
function expPct(p){const e=computeExpiry(p);if(!e)return 0;const st=p.openedDate?new Date(p.openedDate):p.mfgDate?new Date(p.mfgDate):new Date();return Math.min(100,Math.max(0,Math.round(((new Date()-st)/(e-st))*100)));}
function tagCls(s){return s==='ok'?'tok':s==='warn'||s==='danger'?'twarn':s==='unknown'?'tgray':'tdanger';}
function tagTxt(d){if(d===null)return '未設定效期';if(d<0)return '已過期';if(d<=60)return `距到期日還有 ${d} 天`;return '效期良好';}
function expiring_count(){return state.products.filter(p=>{const d=daysLeft(p);return d!==null&&d>=0&&d<=30;}).length;}

async function callClaude(prompt,maxTokens=4096){
  const res=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system:'請使用台灣繁體中文回答，不要使用簡體中文。',messages:[{role:'user',content:prompt}]})});
  if(!res.ok)throw new Error('API '+res.status);
  const data=await res.json();
  if(data.stop_reason&&data.stop_reason!=='end_turn')console.warn('[callClaude] stop_reason:',data.stop_reason);
  return(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
}
function parseJSON(raw){
  const c=raw.replace(/```json|```/g,'').trim();
  function extractFirst(str,open,close){
    const s=str.indexOf(open);
    if(s<0)return null;
    let depth=0,inStr=false,esc=false;
    for(let i=s;i<str.length;i++){
      const ch=str[i];
      if(esc){esc=false;continue;}
      if(ch==='\\'&&inStr){esc=true;continue;}
      if(ch==='"'){inStr=!inStr;continue;}
      if(inStr)continue;
      if(ch===open)depth++;
      else if(ch===close){depth--;if(depth===0)return str.slice(s,i+1);}
    }
    return null;
  }
  const arr=extractFirst(c,'[',']');
  const obj=extractFirst(c,'{','}');
  const arrIdx=arr?c.indexOf(arr[0]):Infinity;
  const objIdx=obj?c.indexOf(obj[0]):Infinity;
  const chosen=arrIdx<=objIdx?arr:obj;
  if(!chosen)throw new Error('No JSON found in response');
  return JSON.parse(chosen);
}

  const candidates=state.products.filter(x=>x.id!==p.id&&x.category===p.category&&!urgentIds.has(x.id));
  const preferred=plan&&plan.standbyIds&&plan.standbyIds.length?candidates.filter(x=>plan.standbyIds.includes(x.id)):candidates;

// Smart standby expiry warnings
const _CAT_MAX_DAYS={'精華液':90,'乳霜':120,'乳液':120,'化妝水':90,'潔顏':60,'潔面':60,'洗顏':60,'面膜':60,'防曬':60};
function _catMaxDays(cat){for(const k of Object.keys(_CAT_MAX_DAYS)){if(cat&&cat.includes(k))return _CAT_MAX_DAYS[k];}return 90;}
function getStandbyExpiryWarnings(){
  const cacheKey='sv_standby_warnings';
  const prodHash=state.products.map(p=>p.id).sort().join(',');
  const planHash=(state.productPlan&&state.productPlan.activeIds)?state.productPlan.activeIds.slice().sort().join('+'):'none';
  const fingerprint=prodHash+'|'+planHash;
  try{
    const c=JSON.parse(localStorage.getItem(cacheKey)||'null');
    if(c&&c.fp===fingerprint&&(Date.now()-c.ts)<3600000)return c.w;
  }catch(e){}
  const plan=state.productPlan;
  const standbyIds=plan&&plan.standbyIds?plan.standbyIds:[];
  const hasActivePlan=plan&&(plan.activeIds.length||plan.standbyIds.length);
  const warnings=[];
  for(const p of state.products){
    if(p.category==='美容儀器')continue;
    if(hasActivePlan&&!standbyIds.includes(p.id))continue; // only standby when plan exists
    if(!hasActivePlan&&plan)continue; // skip if plan exists but product not classified
    const d=daysLeft(p);
    if(d===null||d<0)continue;
    const maxDays=_catMaxDays(p.category);
    if(d<=maxDays+60){warnings.push({name:p.name,brand:p.brand,d,maxDays});}
  }
  try{localStorage.setItem(cacheKey,JSON.stringify({fp:fingerprint,ts:Date.now(),w:warnings}));}catch(e){}
  return warnings;
}

// PRODUCT FORM
function normCategory(cat){
  if(!cat)return'其他';
  const cats=['化妝水','精華','乳液','乳霜','防曬','潔顏','面膜','美容儀器','其他'];
  const exact=cats.find(c=>c===cat);
  if(exact)return exact;
  const partial=cats.find(c=>cat.includes(c)||c.includes(cat));
  if(partial)return partial;
  if(cat.includes('toner')||cat.includes('lotion')&&cat.length<8)return'化妝水';
  if(cat.includes('serum')||cat.includes('essence'))return'精華';
  if(cat.includes('cream')||cat.includes('moisturizer'))return'乳霜';
  if(cat.includes('sunscreen')||cat.includes('spf'))return'防曬';
  if(cat.includes('cleanser')||cat.includes('wash'))return'潔顏';
  if(cat.includes('mask'))return'面膜';
  if(cat.includes('device')||cat.includes('tool')||cat.includes('儀'))return'美容儀器';
  return'其他';
}

  editingId=null;addMode='search';searchResults=[];selectedResult=null;currentImgData=null;window._photoUrl=null;window._photoInfo=null;
  showModal(buildAddModal());
}
function showModal(html){document.getElementById('modal-root').innerHTML=html;}
function closeModal(){document.getElementById('modal-root').innerHTML='';currentImgData=null;window._photoUrl=null;window._photoInfo=null;editingId=null;}

function buildAddModal(){
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-hd"><span class="modal-title">新增產品</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="tabs">
      <button class="tab-btn ${addMode==='search'?'active':''}" onclick="setAddMode('search')">搜尋</button>
      <button class="tab-btn ${addMode==='photo'?'active':''}" onclick="setAddMode('photo')">照片</button>
      <button class="tab-btn ${addMode==='manual'?'active':''}" onclick="setAddMode('manual')">手動</button>
    </div>
    <div id="add-mode-body">${buildAddModeBody()}</div>
    <hr class="divider">
    <div id="add-form-body">${buildProductForm(selectedResult!=null?searchResults[selectedResult]:null)}</div>
    <button class="submit-btn" id="add-submit" onclick="confirmAdd()" disabled>加入產品庫</button>
  </div></div>`;
}
function setAddMode(m){addMode=m;searchResults=[];selectedResult=null;showModal(buildAddModal());}

function buildOptionalPhotoSection(){
  const preview=window._photoUrl?`<div style="position:relative;display:inline-block;"><img src="${window._photoUrl}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border);"><label style="position:absolute;inset:0;cursor:pointer;border-radius:8px;"><input type="file" accept="image/*" style="display:none" onchange="handleOptionalPhoto(event)"></label></div>`:
    `<label style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1.5px dashed var(--border);border-radius:20px;font-size:14px;color:var(--purple);cursor:pointer;background:var(--bg2);">上傳照片<input type="file" accept="image/*" style="display:none" onchange="handleOptionalPhoto(event)"></label>`;
  return `<div style="margin-top:12px;border-top:0.5px solid var(--border);padding-top:12px;"><div style="font-size:11px;color:var(--text2);margin-bottom:8px;">產品照片（選填）</div><div id="opt-photo-area">${preview}</div><div id="opt-photo-status" style="margin-top:6px;"></div></div>`;
}

function buildAddModeBody(){
  if(addMode==='search')return `<div class="search-wrap"><input class="search-input" id="sq" placeholder="例：SK-II 神仙水、美容儀器..." onkeydown="if(event.key==='Enter')doSearch()"><button class="search-btn" id="sbtn" onclick="doSearch()">搜尋</button></div><div id="ss"></div><div id="sr">${searchResults.map(buildRcard).join('')}</div>${buildOptionalPhotoSection()}`;
  if(addMode==='photo')return `<div class="upload-area"><input type="file" accept="image/*" onchange="handlePhoto(event)">${currentImgData?`<img src="${currentImgData}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px;">`:`<div class="upload-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></div><div class="upload-text">點擊上傳或拍照</div>`}</div><div id="photo-status"></div>`;
  return `<div class="sbox sinfo">直接填寫下方資訊</div>${buildOptionalPhotoSection()}`;
}

async function handleOptionalPhoto(e){
  const file=e.target.files[0];if(!file)return;
  const ps=document.getElementById('opt-photo-status');
  if(ps)ps.innerHTML=`<div class="sbox sloading">上傳中 <span class="dot-anim">●</span></div>`;
  const reader=new FileReader();
  reader.onload=async ev=>{
    let compressed;
    try{compressed=await compressImage(ev.target.result,800,0.75);}catch{compressed=ev.target.result;}
    const base64=compressed.split(',')[1];
    try{
      const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageData:base64,mimeType:'image/jpeg'})});
      const data=await res.json();
      if(data.url){
        window._photoUrl=data.url;
        const area=document.getElementById('opt-photo-area');
        if(area)area.innerHTML=`<div style="position:relative;display:inline-block;"><img src="${data.url}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border);"><label style="position:absolute;inset:0;cursor:pointer;border-radius:8px;" title="點擊更換照片"><input type="file" accept="image/*" style="display:none" onchange="handleOptionalPhoto(event)"></label></div>`;
        if(ps)ps.innerHTML=`<div class="sbox ssuccess">✓ 照片已上傳</div>`;
      }else{
        if(ps)ps.innerHTML=`<div class="sbox swarn">上傳失敗：${data.error||'未知錯誤'}</div>`;
      }
    }catch(err){
      if(ps)ps.innerHTML=`<div class="sbox swarn">上傳失敗，請再試一次</div>`;
    }
  };
  reader.readAsDataURL(file);
}
function buildRcard(r,i){
  return `<div class="rcard ${selectedResult===i?'sel':''}" id="rc${i}" onclick="pickResult(${i})">
    <div class="rcard-name">${r.name}${selectedResult===i?' <span style="color:var(--purple);font-size:11px;font-weight:600;">✓ 已選</span>':''}</div>
    <div class="rcard-brand">${r.brand}</div>
    <div class="rcard-desc">${r.desc||''}</div>
    <div class="rcard-tags">${(r.tags||[]).map(t=>`<span class="rtag">${t}</span>`).join('')}</div>
  </div>`;
}

async function doSearch(){
  const q=(document.getElementById('sq')||{}).value||'';
  if(!q.trim()||isSearching)return;
  isSearching=true;
  const btn=document.getElementById('sbtn'),ss=document.getElementById('ss');
  if(btn)btn.disabled=true;
  if(ss)ss.innerHTML=`<div class="sbox sloading">查詢中 <span class="dot-anim">●</span></div>`;
  try{
    const raw=await callClaude(`你是保養品與美容儀器專家資料庫。搜尋：「${q}」。回傳最多3個符合的真實產品。如果該產品有官方中文品名，name欄位請優先使用中文品名；若無中文品名再使用英文。只回純JSON：[{"brand":"","name":"","category":"化妝水或精華或乳液或乳霜或防曬或潔顏或面膜或美容儀器或其他","pao":月數或0,"emoji":"","desc":"功效1句","tags":["標籤"],"advice":"使用建議1-2句","ingredients":"主要成分或空字串","benefits":"主要功效，用逗號分隔，例如：保濕、抗老、美白"}]`);
    searchResults=parseJSON(raw);selectedResult=null;
    if(ss)ss.innerHTML=`<div class="sbox ssuccess">✓ 找到 ${searchResults.length} 個結果，點選後自動填入</div>`;
    const sr=document.getElementById('sr');
    if(sr)sr.innerHTML=searchResults.map(buildRcard).join('');
  }catch{if(ss)ss.innerHTML=`<div class="sbox swarn">查詢失敗，請換關鍵字或改用手動輸入</div>`;}
  isSearching=false;if(btn)btn.disabled=false;
}

function pickResult(i){
  selectedResult=i;const r=searchResults[i];
  searchResults.forEach((_,j)=>{const el=document.getElementById('rc'+j);if(el){el.classList.toggle('sel',j===i);el.querySelector('.rcard-name').innerHTML=`${_.name}${j===i?' <span style="color:var(--purple);font-size:11px;font-weight:600;">✓ 已選</span>':''}`;}}); 
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!==undefined&&v!==null)el.value=v;};
  set('fb',r.brand);set('fn',r.name);set('fp',r.pao||'');set('fing',r.ingredients||'');
  // 重新渲染表單以確保 select 正確顯示
  const formBody=document.getElementById('add-form-body');
  if(formBody){formBody.innerHTML=buildProductForm(r);}
  window._pendingAdvice=r.advice;window._pendingEmoji=r.emoji;
  checkAddBtn();onCatChange();
}

function compressImage(dataUrl,maxSize,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxSize||h>maxSize){if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}else{w=Math.round(w*maxSize/h);h=maxSize;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>reject(new Error('Image load failed'));
    img.src=dataUrl;
  });
}

function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  console.log('[handlePhoto] file selected:',file.name,file.type,file.size);
  const reader=new FileReader();
  reader.onload=async ev=>{
    console.log('[handlePhoto] FileReader loaded, compressing...');
    let compressed;
    try{
      compressed=await compressImage(ev.target.result,800,0.75);
      console.log('[handlePhoto] compressed size:',compressed.length);
    }catch(compErr){
      console.error('[handlePhoto] compressImage failed, using original:',compErr);
      compressed=ev.target.result;
    }
    currentImgData=compressed;
    const base64=compressed.split(',')[1],mime='image/jpeg';
    console.log('[handlePhoto] base64 length:',base64.length);
    const ua=document.querySelector('.upload-area');
    if(ua)ua.innerHTML=`<input type="file" accept="image/*" onchange="handlePhoto(event)"><img src="${compressed}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px;">`;
    const ps=document.getElementById('photo-status');
    if(ps)ps.innerHTML=`<div class="sbox sloading">AI 辨識中 <span class="dot-anim">●</span></div>`;
    console.log('[handlePhoto] firing /api/upload + /api/claude in parallel...');
    try{
      const [uploadResult,claudeResult]=await Promise.allSettled([
        fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageData:base64,mimeType:mime})}).then(r=>{console.log('[upload] HTTP status:',r.status);return r.json();}),
        fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:500,system:'請使用台灣繁體中文回答，不要使用簡體中文。',messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:base64}},{type:'text',text:'辨識此保養品或美容儀器。如果有官方中文品名，name請優先使用中文。只回純JSON：{"brand":"","name":"","category":"","pao":12,"emoji":"","advice":"1-2句","ingredients":"","benefits":"主要功效，用逗號分隔，例如：保濕、抗老"}'}]}]})}).then(r=>{console.log('[claude] HTTP status:',r.status);return r.json();})
      ]);
      console.log('[handlePhoto] uploadResult:',uploadResult.status, uploadResult.status==='fulfilled'?uploadResult.value:uploadResult.reason);
      console.log('[handlePhoto] claudeResult:',claudeResult.status);
      if(uploadResult.status==='fulfilled'&&uploadResult.value.url){window._photoUrl=uploadResult.value.url;console.log('[handlePhoto] photoUrl set:',window._photoUrl);}
      else{console.warn('[handlePhoto] upload failed or no url, imgUrl will be null');}
      if(claudeResult.status!=='fulfilled')throw new Error('AI error: '+claudeResult.reason);
      const info=JSON.parse((claudeResult.value.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').replace(/```json|```/g,'').trim());
      window._photoInfo=info;
      const formBody2=document.getElementById('add-form-body');
      if(formBody2){formBody2.innerHTML=buildProductForm(info);}
      if(ps)ps.innerHTML=`<div class="sbox ssuccess">✓ 辨識完成${window._photoUrl?'，照片已上傳':'（照片上傳失敗，僅保存辨識結果）'}</div>`;
      checkAddBtn();onCatChange();
    }catch(err){
      console.error('[handlePhoto] error:',err);
      if(ps)ps.innerHTML=`<div class="sbox swarn">辨識失敗，請手動填寫</div>`;
    }
  };
  reader.readAsDataURL(file);
}

function confirmAdd(){
  const v=getFormValues();if(!v.brand||!v.name)return;
  const src=selectedResult!=null?searchResults[selectedResult]:(window._photoInfo||{});
  state.products.push({id:state.nextId++,...v,benefits:v.benefits||src.benefits||'',emoji:src.emoji||window._pendingEmoji||'',advice:src.advice||window._pendingAdvice||'',imgUrl:window._photoUrl||null});
  saveState();clearAdviceCache();window._photoInfo=null;window._pendingAdvice=null;window._pendingEmoji=null;currentImgData=null;window._photoUrl=null;searchResults=[];selectedResult=null;
  closeModal();
  // Check if new product has urgent expiry and plan exists
  const plan=state.productPlan;
  if(plan&&plan.activeIds.length>0){
    const newProd=state.products[state.products.length-1];
    const newDays=daysLeft(newProd);
    if(newDays!==null&&newDays>=0&&newDays<=30){
      const activeExpiries=state.products.filter(p=>plan.activeIds.includes(p.id)).map(p=>daysLeft(p)).filter(d=>d!==null);
      const minActive=activeExpiries.length?Math.min(...activeExpiries):999;
      if(newDays<=minActive){
        if(confirm(`你新增的「${newProd.name}」效期較近（還有 ${newDays} 天），是否要重新規劃使用清單？`)){
          render();planProducts();return;
        }else{
          if(!plan.standbyIds.includes(newProd.id))plan.standbyIds.push(newProd.id);
          saveState();
        }
      }
    }
  }
  render();
}

// EDIT
function openEdit(id){
  editingId=id;
  const p=state.products.find(x=>x.id===id);if(!p)return;
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-hd"><span class="modal-title">編輯產品</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${buildProductForm(p)}
    <button class="submit-btn" onclick="saveEdit()" style="margin-top:8px;">儲存變更</button>
    <button class="danger-btn" onclick="deleteProduct(${p.id})">刪除此產品</button>
  </div></div>`);
}
function saveEdit(){
  const v=getFormValues();if(!v.brand||!v.name)return;
  const idx=state.products.findIndex(p=>p.id===editingId);if(idx<0)return;
  state.products[idx]={...state.products[idx],...v};
  saveState();closeModal();render();
}

// DETAIL

  const p=state.products.find(x=>x.id===id);if(!p)return;
  const d=daysLeft(p),s=expStatus(d),exp=computeExpiry(p);
  const isDevice=p.category==='美容儀器';
  showModal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-hd"><span class="modal-title">產品詳情</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="det-hero">${imgSrc(p)?`<img src="${imgSrc(p)}">`:(prodIcon(p))}</div>
    <div class="det-brand">${p.brand}</div>
    <div class="det-name">${p.name}</div>
    <div class="det-row"><span class="det-k">類別</span><span class="det-v">${p.category}</span></div>

    ${p.openedDate&&!isDevice?`<div class="det-row"><span class="det-k">開封日期</span><span class="det-v">${fmt(p.openedDate)}</span></div>`:''}
    ${p.pao&&!isDevice?`<div class="det-row"><span class="det-k">開封後可用</span><span class="det-v">${p.pao} 個月</span></div>`:''}
    ${exp&&!isDevice?`<div class="det-row"><span class="det-k">建議用完日期</span><span class="det-v">${exp.toISOString().split('T')[0].replace(/-/g,'/')}</span></div>`:''}
    ${!isDevice?`<div class="det-row"><span class="det-k">效期狀態</span><span class="det-v"><span class="tag ${tagCls(s)}">${tagTxt(d)}</span></span></div>`:''}
    ${p.ingredients?`<div class="det-row"><span class="det-k">主要成分</span><span class="det-v" style="font-size:11px;text-align:right;max-width:60%;">${p.ingredients}</span></div>`:''}
    ${p.benefits?`<div class="det-row" style="align-items:flex-start;"><span class="det-k">主要功效</span><div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:65%;">${p.benefits.split(/[,，、]/).map(b=>b.trim()).filter(Boolean).map(b=>`<span style="font-size:11px;color:#8B7355;background:#F5EFE6;border-radius:6px;padding:2px 7px;">${b}</span>`).join('')}</div></div>`:''}
    <div id="det-advice-${p.id}">${p.advice?`<div class="infobox infobox-purple"><div class="infobox-title">AI 使用建議</div><div class="infobox-body">${p.advice}</div></div>`:''}</div>
    <button class="ghost-btn" style="margin-top:4px;margin-bottom:0;font-size:13px;" onclick="regenProductAdvice(${p.id})">↻ 重新生成 AI 建議</button>
    ${isDevice?`<button class="ghost-btn" style="margin-top:8px;" onclick="closeModal();currentAdviceTab='device';gotoTab('advice')">查看儀器搭配建議 →</button>`:''}
    <button class="edit-btn" onclick="closeModal();openEdit(${p.id})">編輯產品資料</button>
    <button class="danger-btn" onclick="deleteProduct(${p.id})">刪除此產品</button>
  </div></div>`);
}
function deleteProduct(id){if(!confirm('確定要刪除？'))return;state.products=state.products.filter(p=>p.id!==id);saveState();clearAdviceCache();closeModal();render();}
async function regenProductAdvice(id){
  const p=state.products.find(x=>x.id===id);if(!p)return;
  const box=document.getElementById('det-advice-'+id);
  if(box)box.innerHTML=`<div class="infobox infobox-purple"><div class="infobox-title">AI 使用建議</div><div class="infobox-body" style="color:var(--text2);">生成中<span class="dots-seq"><span>．</span><span>．</span><span>．</span></span></div></div>`;
  try{
    const advice=await callClaude(`請為以下保養品生成 1-2 句繁體中文使用建議，語氣親切實用，不要重複品名，直接說明使用時機與搭配方式：\n品牌：${p.brand}\n名稱：${p.name}\n類別：${p.category}${p.ingredients?'\n成分：'+p.ingredients:''}${p.benefits?'\n功效：'+p.benefits:''}\n\n只回使用建議的文字，不要 JSON，不要標題。`,300);
    const trimmed=advice.trim();
    p.advice=trimmed;
    saveState();
    if(box)box.innerHTML=`<div class="infobox infobox-purple"><div class="infobox-title">AI 使用建議</div><div class="infobox-body">${trimmed}</div></div>`;
  }catch(e){
    if(box)box.innerHTML=`<div class="infobox infobox-purple"><div class="infobox-title">AI 使用建議</div><div class="infobox-body" style="color:#C0392B;">生成失敗，請稍後再試</div></div>`;
  }
}

  const svgMoon=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>`;
  const svgCal=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
  const svgDrop=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c0 0-8 8-8 13a8 8 0 0016 0c0-5-8-13-8-13z"/></svg>`;
  const svgWand=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5L8 21H3v-5L15 4z"/><line x1="12" y1="7" x2="17" y2="12"/></svg>`;

// 找到產品物件（支援模糊比對名稱）
function findProduct(name){
  if(!name)return null;
  const n=name.trim().toLowerCase();
  const prods=state.products.filter(p=>p.category!=='美容儀器');
  let best=null,bestScore=-1;
  const scores=[];
  for(const p of prods){
    const pn=p.name.trim().toLowerCase();
    const full=(p.brand.trim()+' '+p.name.trim()).toLowerCase();
    let score=0;
    if(n===pn||n===full) score=100;
    else if(n.includes(full)&&full.length>3) score=80+full.length;
    else if(n.includes(pn)&&pn.length>3) score=60+pn.length;
    else if(pn.includes(n)&&n.length>4) score=40+n.length;
    scores.push({name:p.brand+' '+p.name,score});
    if(score>bestScore){bestScore=score;best=p;}
  }
  console.log('[findProduct] input:',JSON.stringify(name));
  console.log('[findProduct] scores:',scores.filter(s=>s.score>0).sort((a,b)=>b.score-a.score));
  console.log('[findProduct] result:',best?best.brand+' '+best.name:'null');
  return bestScore>0?best:null;
}

function renderWeekPlanResult(data,isConfirmed){
  const days=data.week||[];
  const todayIdx=new Date().getDay();
  const dayMap={'週一':1,'週二':2,'週三':3,'週四':4,'週五':5,'週六':6,'週日':0};
  const html=days.map(d=>{
    const isToday=dayMap[d.day]===todayIdx;
    const prodTxtColor=isToday?'rgba(255,255,255,0.82)':'var(--text)';
    const _wkProdRow=(n,txtColor)=>{const{name:dn,mode}=_devEntry(n);const isDev=findProduct(dn)?.category==='美容儀器';return`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">${prodThumb(dn)}<div style="min-width:0;"><span style="font-size:11px;color:${txtColor};">${dn}</span>${isDev&&mode?`<div style="font-size:9px;font-family:var(--mono);color:${isToday?'rgba(220,165,80,0.85)':'var(--rust)'};letter-spacing:0.06em;margin-top:1px;">${mode}</div>`:''}</div></div>`;};
    const morningProds=(d.morning||[]).map(n=>_wkProdRow(n,prodTxtColor)).join('');
    const eveningProds=(d.evening||[]).map(n=>_wkProdRow(n,prodTxtColor)).join('');
    const mLabelColor=isToday?'rgba(220,165,80,0.9)':'#A07820';
    const eLabelColor=isToday?'rgba(160,155,230,0.9)':'#534AB7';
    const emptyTxtColor=isToday?'rgba(255,255,255,0.3)':'var(--text3)';
    return`<div style="background:${isToday?'#2C2824':'white'};border:${isToday?'none':'0.5px solid var(--border)'};border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
        <span style="font-size:15px;font-weight:${isToday?500:400};color:${isToday?'rgba(255,255,255,0.9)':'var(--text)'};">${d.day}</span>
        ${isToday?`<span style="font-size:11px;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);padding:2px 8px;border-radius:10px;font-weight:400;letter-spacing:0.06em;">今天</span>`:''}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div>
          <div style="font-size:11px;font-weight:500;color:${mLabelColor};margin-bottom:6px;letter-spacing:0.06em;">早間</div>
          ${morningProds||`<div style="font-size:11px;color:${emptyTxtColor};">基礎清潔保濕</div>`}
        </div>
        <div>
          <div style="font-size:11px;font-weight:500;color:${eLabelColor};margin-bottom:6px;letter-spacing:0.06em;">晚間</div>
          ${eveningProds||`<div style="font-size:11px;color:${emptyTxtColor};">基礎清潔保濕</div>`}
        </div>
      </div>
    </div>`;
  }).join('');
  const confirmedBadgeW=isConfirmed?`<div style="font-size:12px;color:#4caf50;margin-bottom:12px;font-weight:500;">已確認 · 上次確認：${window._confirmedPlan?.confirmedAt||''}</div>`:'';
  const confirmBtnW=!isConfirmed&&window._routine_morning&&window._routine_evening&&window._weekplan?`<button class="submit-btn" style="margin-top:8px;" onclick="confirmPlan()">確認並儲存這份保養計畫</button>`:'';
  return`<div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;"><div class="card-title">一週保養排程</div>${confirmedBadgeW}${html}${confirmBtnW}<button class="ghost-btn" style="margin-top:8px;" onclick="regenPlan('week')">重新生成</button></div>`;
}

async function handleCondition(id,label){

function importBackup(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.products||!Array.isArray(data.products))throw new Error('格式錯誤');
      if(!confirm(`確定要匯入備份嗎？\n這將覆蓋現有的 ${state.products.length} 個產品資料，匯入後將有 ${data.products.length} 個產品。`))return;
      state={...DEFAULT,...data};
      if(!state.reminders)state.reminders=JSON.parse(JSON.stringify(DEFAULT.reminders));
if(!state.lifestyle)state.lifestyle=JSON.parse(JSON.stringify(DEFAULT.lifestyle));
      state.products=state.products.map(p=>({mfgDate:'',expiryDate:'',benefits:'',...p}));
      // 先存本地
      try{localStorage.setItem(STORAGE_KEY,serializeState(state));}catch(e){}
      render();
      // 強制存到雲端，不管有沒有真實資料
      const el=document.getElementById('backup-status');
      if(el)el.innerHTML=`<div class="sbox sloading">正在儲存到雲端... <span class="dot-anim">●</span></div>`;
      const stateToSave = {
  ...state,
  products: state.products.map(p => { const {imgData, ...rest} = p; return rest; })
};
saveToCloud(stateToSave).then(()=>{
        if(el)el.innerHTML=`<div class="sbox ssuccess">✓ 成功匯入 ${data.products.length} 個產品並已存到雲端！</div>`;
      }).catch(()=>{
        if(el)el.innerHTML=`<div class="sbox ssuccess">✓ 成功匯入 ${data.products.length} 個產品！（雲端同步失敗，請重試）</div>`;
      });
    }catch(err){
      const el=document.getElementById('backup-status');
      if(el)el.innerHTML=`<div class="sbox swarn">匯入失敗，請確認檔案格式正確</div>`;
    }
  };
  reader.readAsText(file);
  e.target.value='';
}

window.applySwUpdate=function(){
  if(window._pendingSwWorker)window._pendingSwWorker.postMessage({type:'SKIP_WAITING'});
  navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
};
if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('/service-worker.js');
      // Already waiting (e.g. user returned after a deploy)
      if(reg.waiting)_swShowBanner(reg.waiting);
      // New SW found while page is open
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller)_swShowBanner(nw);
        });
      });
      // Poll for updates every hour
      setInterval(()=>reg.update(),60*60*1000);
    }catch(e){}
  });
}

async function autofillBenefits(){
  const missing=state.products.filter(p=>!p.benefits);
  if(!missing.length)return;
  try{
    const list=missing.map(p=>`id:${p.id} 品牌:${p.brand} 名稱:${p.name} 類別:${p.category}${p.ingredients?' 成分:'+p.ingredients:''}`).join('\n');
    const raw=await callClaude(`以下是保養品清單，請為每個產品生成 1-3 個主要功效關鍵詞（繁體中文，用逗號分隔，例如：保濕、抗老）。只回純 JSON 陣列，每項包含 id 和 benefits：\n${list}\n\n格式：[{"id":產品id,"benefits":"功效1、功效2"}]`,1000);
    const results=parseJSON(raw);
    if(!Array.isArray(results))return;
    let changed=false;
    results.forEach(r=>{
      const p=state.products.find(x=>x.id===r.id);
      if(p&&r.benefits&&!p.benefits){p.benefits=r.benefits;changed=true;}
    });
    if(changed){
      saveState();
      if(state.tab==='products'||state.tab==='home')render();
    }
  }catch(e){console.log('[autofillBenefits] failed:',e.message);}
}

// Welcome is now shown from initFromCloud() based on cloud data availability

document.addEventListener('click',function(e){
  const delBtn=e.target.closest('[data-del-id]');
  if(delBtn){
    e.stopPropagation();
    const id=parseInt(delBtn.dataset.delId);
    const name=delBtn.dataset.delName;
    if(confirm('確定要刪除「'+name+'」嗎？')){
      state.products=state.products.filter(p=>p.id!==id);
      saveState();render();
    }
    return;
  }
  const pcard=e.target.closest('[data-pid]');
  if(pcard){openDetail(parseInt(pcard.dataset.pid));}
});
</script>
</body>
</html>
