<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SkincareVault">

<title>SkincareVault</title>
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --accent:#8B7355;--accent-light:#F5EFE7;--accent-mid:#C4A882;
  --purple:#8B7355;--purple-light:#F5EFE7;--purple-mid:#C4A882;
  --teal:#3A8C6E;--teal-light:#EBF5F0;
  --amber:#A07820;--amber-light:#FBF3DC;
  --coral:#A85848;--coral-light:#F7EAE6;
  --red:#A84848;--red-light:#F7E8E8;
  --bg:#FAF8F4;--bg2:#FFFFFF;--bg3:#F0EBE3;
  --text:#2C2824;--text2:#6B5F58;--text3:#C4B8B0;
  --border:#E8E2D9;--border2:#D0C8BE;
  --btn:#2C2824;
  --radius:6px;--radius-sm:4px;
}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;width:100%;margin:0;padding:0;font-weight:300;}
.app{min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;background:var(--bg);width:100%;}
.topbar{background:var(--bg2);border-bottom:0.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;width:100%;}
.topbar-title{font-size:15px;font-weight:300;color:var(--text);letter-spacing:0.16em;}
.topbar-sub{font-size:12px;color:var(--text2);margin-top:1px;letter-spacing:0.06em;}
.nav{display:flex;background:var(--bg2);border-bottom:0.5px solid var(--border);position:sticky;top:53px;z-index:10;width:100%;}
.nav-btn{flex:1;min-width:0;padding:10px 2px 8px;font-size:11px;color:var(--text2);background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-weight:400;letter-spacing:0.06em;}
.nav-btn.active{color:var(--text);}
.nav-btn.active svg{stroke:var(--text);}
.nav-icon{display:flex;align-items:center;justify-content:center;}
.content{padding:14px;flex:1;}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.card-title{font-size:11px;font-weight:300;color:var(--text);margin-bottom:10px;letter-spacing:0.12em;}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.section-label{font-size:12px;font-weight:300;color:var(--text2);letter-spacing:0.12em;}
.add-btn{background:var(--btn);color:white;border:none;border-radius:var(--radius);padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:300;letter-spacing:0.1em;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.stat{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 8px;}
.stat-n{font-size:20px;font-weight:300;color:var(--text);}
.stat-l{font-size:9px;color:var(--text2);margin-top:2px;letter-spacing:0.08em;}
.skin-banner{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.skin-val{font-size:15px;font-weight:300;color:var(--text);}
.skin-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.skin-btn{font-size:12px;color:var(--text);background:var(--bg2);border:0.5px solid var(--border);border-radius:2px;padding:4px 10px;cursor:pointer;letter-spacing:0.08em;font-weight:300;}
.alert-banner{border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;font-size:11px;display:flex;align-items:flex-start;gap:8px;font-weight:300;}
.alert-warn{background:var(--amber-light);border:0.5px solid var(--amber);color:#6B5010;}
.alert-danger{background:var(--red-light);border:0.5px solid var(--red);color:#6B2020;}
.alert-icon{font-size:14px;flex-shrink:0;margin-top:1px;}
.alert-title{font-weight:400;margin-bottom:2px;letter-spacing:0.06em;}
.product-list{display:flex;flex-direction:column;gap:8px;}
.pcard{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;gap:12px;padding:11px 13px;cursor:pointer;}
.pcard-emoji{width:44px;height:44px;border-radius:var(--radius);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.pcard-emoji img{width:100%;height:100%;object-fit:cover;}
.pcard-body{flex:1;min-width:0;}
.pcard-brand{font-size:9px;color:var(--text2);letter-spacing:0.08em;font-weight:300;}
.pcard-name{font-size:15px;font-weight:300;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard-bar-wrap{display:flex;align-items:center;gap:6px;margin-top:6px;}
.pbar{flex:1;height:1px;background:var(--border);overflow:hidden;}
.pbar-fill{height:100%;}
.tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:2px;font-weight:300;letter-spacing:0.06em;}
.tok{background:var(--teal-light);color:#2A6E58;}
.twarn{background:var(--amber-light);color:#6B5010;}
.tdanger{background:var(--red-light);color:#6B2020;}
.tgray{background:var(--bg3);color:var(--text2);}
.modal-overlay{position:fixed;inset:0;background:rgba(44,40,36,.45);z-index:100;display:flex;align-items:flex-end;}
.modal{background:var(--bg2);border-radius:10px 10px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:20px 16px 36px;}
.modal-handle{width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:15px;font-weight:300;color:var(--text);letter-spacing:0.12em;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text2);line-height:1;padding:0;}
.fl{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:300;letter-spacing:0.08em;}
.fi{width:100%;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:15px;font-family:inherit;color:var(--text);background:var(--bg2);margin-bottom:12px;-webkit-appearance:none;font-weight:300;}
.fi:focus{outline:none;border-color:var(--accent);}
.fi-opt{border-style:dashed;opacity:0.8;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.expiry-hint{font-size:12px;color:var(--text2);background:var(--bg3);border-radius:var(--radius);padding:8px 10px;margin-bottom:12px;line-height:1.5;font-weight:300;}
.tabs{display:flex;border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
.tab-btn{flex:1;padding:9px 4px;font-size:11px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--text2);font-weight:300;letter-spacing:0.06em;}
.tab-btn.active{background:var(--btn);color:white;}
.upload-area{border:0.5px dashed var(--border2);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:12px;cursor:pointer;background:var(--bg3);position:relative;min-height:90px;}
.upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-icon{font-size:22px;margin-bottom:6px;opacity:0.5;}
.upload-text{font-size:11px;color:var(--text2);font-weight:300;letter-spacing:0.08em;}
.sbox{border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;font-size:11px;line-height:1.5;font-weight:300;}
.sloading{background:var(--bg3);border:0.5px solid var(--border);color:var(--text2);}
.ssuccess{background:var(--teal-light);border:0.5px solid var(--teal);color:#2A6E58;}
.swarn{background:var(--amber-light);border:0.5px solid var(--amber);color:#6B5010;}
.sinfo{background:var(--bg3);border:0.5px solid var(--border);color:var(--text2);}
.search-wrap{display:flex;gap:8px;margin-bottom:10px;}
.search-input{flex:1;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:15px;font-family:inherit;color:var(--text);background:var(--bg2);font-weight:300;}
.search-btn{background:var(--btn);color:white;border:none;border-radius:var(--radius);padding:10px 16px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:300;letter-spacing:0.08em;}
.search-btn:disabled{opacity:.5;}
.rcard{border:0.5px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;cursor:pointer;background:var(--bg2);}
.rcard.sel{border-color:var(--accent);background:var(--accent-light);}
.rcard-name{font-size:15px;font-weight:300;color:var(--text);margin-bottom:2px;}
.rcard-brand{font-size:12px;color:var(--text2);margin-bottom:4px;letter-spacing:0.06em;}
.rcard-desc{font-size:11px;color:var(--text2);line-height:1.5;font-weight:300;}
.rcard-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.rtag{font-size:9px;padding:2px 6px;background:var(--bg3);color:var(--text2);border-radius:2px;}
.submit-btn{width:100%;background:var(--btn);color:white;border:none;border-radius:var(--radius);padding:13px;font-size:15px;font-weight:300;cursor:pointer;font-family:inherit;margin-top:4px;letter-spacing:0.1em;}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;}
.ghost-btn{width:100%;background:none;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px;font-size:14px;cursor:pointer;color:var(--text2);font-family:inherit;margin-top:8px;font-weight:300;letter-spacing:0.06em;}
.edit-btn{width:100%;background:var(--bg3);border:0.5px solid var(--border);color:var(--text);border-radius:var(--radius);padding:10px;font-size:14px;cursor:pointer;margin-top:8px;font-family:inherit;font-weight:300;letter-spacing:0.06em;}
.danger-btn{width:100%;background:none;border:0.5px solid #D4A0A0;color:#8B4040;border-radius:var(--radius);padding:10px;font-size:14px;cursor:pointer;margin-top:8px;font-family:inherit;font-weight:300;}
.divider{border:none;border-top:0.5px solid var(--border);margin:14px 0;}
.seg-row{display:flex;gap:8px;margin-bottom:12px;}
.seg-tag{padding:6px 14px;border:0.5px solid var(--border);border-radius:2px;font-size:11px;cursor:pointer;color:var(--text2);background:var(--bg2);font-family:inherit;font-weight:300;letter-spacing:0.06em;}
.seg-tag.active{background:var(--btn);color:white;border-color:var(--btn);}
.det-hero{width:100%;height:150px;background:var(--bg3);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:14px;overflow:hidden;}
.det-hero img{width:100%;height:100%;object-fit:cover;}
.det-brand{font-size:12px;color:var(--text2);letter-spacing:0.1em;font-weight:300;}
.det-name{font-size:17px;font-weight:300;color:var(--text);margin-bottom:12px;}
.det-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:14px;}
.det-k{color:var(--text2);font-weight:300;}
.det-v{color:var(--text);font-weight:300;}
.infobox{border-radius:var(--radius);padding:12px 14px;margin-top:10px;}
.infobox-purple{background:var(--accent-light);border:0.5px solid var(--accent-mid);}
.infobox-coral{background:var(--coral-light);border:0.5px solid var(--coral);}
.infobox-teal{background:var(--teal-light);border:0.5px solid var(--teal);}
.infobox-title{font-size:12px;font-weight:300;margin-bottom:5px;letter-spacing:0.08em;}
.infobox-purple .infobox-title{color:var(--accent);}
.infobox-coral .infobox-title{color:var(--coral);}
.infobox-teal .infobox-title{color:var(--teal);}
.infobox-body{font-size:11px;line-height:1.7;font-weight:300;}
.infobox-purple .infobox-body{color:var(--text);}
.infobox-coral .infobox-body{color:#7A3828;}
.infobox-teal .infobox-body{color:#2A6E58;}
.advice-seg{display:flex;border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
.aseg-btn{flex:1;padding:7px 2px 6px;font-size:9px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--text2);font-weight:400;letter-spacing:0.06em;display:flex;flex-direction:column;align-items:center;gap:3px;}
.aseg-btn.active{background:var(--btn);color:white;}
.aseg-btn.active svg{stroke:white;}
.routine-step{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start;}
.step-num{width:20px;height:20px;border-radius:50%;background:none;border:0.5px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:300;flex-shrink:0;margin-top:2px;}
.step-body{flex:1;}
.step-title{font-size:15px;font-weight:400;color:var(--text);margin-bottom:3px;letter-spacing:0.04em;}
.step-desc{font-size:14px;color:#5C5248;line-height:1.6;font-weight:300;}
.step-product{font-size:12px;color:var(--accent);margin-top:4px;font-weight:300;letter-spacing:0.04em;}
.condition-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.cond-btn{padding:11px 8px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:14px;cursor:pointer;text-align:center;background:var(--bg2);color:var(--text);font-family:inherit;font-weight:300;}
.compat-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);}
.compat-item:last-child{border:none;}
.compat-icon{font-size:15px;flex-shrink:0;margin-top:1px;}
.compat-title{font-size:14px;font-weight:300;color:var(--text);margin-bottom:3px;}
.compat-desc{font-size:11px;color:var(--text2);line-height:1.5;font-weight:300;}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.opt-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.opt-btn{padding:10px 6px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:14px;cursor:pointer;text-align:center;background:var(--bg2);color:var(--text);font-family:inherit;font-weight:300;}
.opt-btn.sel{background:var(--btn);color:white;border-color:var(--btn);}
.save-btn{width:100%;background:var(--btn);color:white;border:none;border-radius:var(--radius);padding:12px;font-size:15px;font-weight:300;cursor:pointer;font-family:inherit;margin-top:4px;letter-spacing:0.1em;}
.advice-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:8px;}
.ac-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ac-icon{width:15px;height:15px;color:var(--accent);flex-shrink:0;margin-top:1px;}
.ac-title{font-size:14px;font-weight:300;color:var(--text);letter-spacing:0.06em;}
.ac-body{font-size:11px;color:var(--text2);line-height:1.7;font-weight:300;}
.reminder-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border);}
.reminder-row:last-of-type{border:none;}
.reminder-label{font-size:14px;font-weight:300;color:var(--text);}
.reminder-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.toggle{width:40px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;outline:none;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:white;border-radius:50%;top:3px;left:3px;transition:left .2s;}
.toggle.on::after{left:19px;}
.time-input{border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg2);font-weight:300;}
.lifestyle-section-title{font-size:13px;font-weight:500;color:var(--accent);margin:14px 0 8px;letter-spacing:0.05em;}
.lifestyle-row{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
.lifestyle-row:last-child{border-bottom:none;padding-bottom:0;}
.lifestyle-label{font-size:14px;color:var(--text);font-weight:300;}
.lifestyle-select{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);font-family:inherit;font-weight:300;cursor:pointer;}
.empty{text-align:center;padding:40px 16px;color:var(--text2);font-size:14px;font-weight:300;letter-spacing:0.08em;}
.empty-icon{font-size:28px;margin-bottom:12px;opacity:0.4;}
.dot-anim{animation:blink 1s infinite;display:inline-block;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dots-seq span{display:inline-block;animation:dot-seq 1.2s infinite both;}
.dots-seq span:nth-child(2){animation-delay:.2s;}
.dots-seq span:nth-child(3){animation-delay:.4s;}
@keyframes dot-seq{0%,60%,100%{opacity:.15}30%{opacity:1}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">SKINCARE VAULT</div>
      <div class="topbar-sub" id="topbar-date"></div>
    </div>
  </div>
  <div class="nav">
    <button class="nav-btn active" onclick="gotoTab('home')" id="tab-home"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V21H15v-8H9v8H3V10.5z"/></svg></span>首頁</button>
    <button class="nav-btn" onclick="gotoTab('products')" id="tab-products"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M8 3v4l-3 3v11a1 1 0 001 1h12a1 1 0 001-1V10l-3-3V3"/><line x1="5" y1="13" x2="19" y2="13"/></svg></span>產品庫</button>
    <button class="nav-btn" onclick="gotoTab('advice')" id="tab-advice"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12M12 12C12 7 8 4 4 3c0 5 4 9 8 9z"/><path d="M12 12C12 7 16 4 20 3c0 5-4 9-8 9z"/></svg></span>保養建議</button>
    <button class="nav-btn" onclick="gotoTab('skin')" id="tab-skin"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></span>設定</button>
  </div>
  <div class="content" id="main-content"></div>
  <div id="modal-root"></div>
</div>
<script>
const API_ENDPOINT='/api/claude';
// NO EMOJI POLICY: All icons must use SVG line icons (stroke-width:1.5, fill:none). No emoji in UI.
const STORAGE_KEY='skincarevault_v2';

// 雲端儲存
async function saveToCloud(data) {
  const res = await fetch('/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'save', data })
  });
  if(!res.ok) throw new Error('Save failed');
  return true;
}

async function loadFromCloud() {
  try {
    const res = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'load' })
    });
    const json = await res.json();
    return json.data || null;
  } catch(e) { return null; }
}

function loadState(){
  try{
    const r=localStorage.getItem(STORAGE_KEY);
    if(r){const d=JSON.parse(r);if(d&&d.products)return d;}
    const keys=['skincarevault_v1','skincarevault_v2','skincarevault'];
    for(const k of keys){
      if(k===STORAGE_KEY)continue;
      try{const d=JSON.parse(localStorage.getItem(k)||'');if(d&&d.products&&d.products.length>0){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d;}}catch(e){}
    }
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k===STORAGE_KEY)continue;
      try{const d=JSON.parse(localStorage.getItem(k));if(d&&d.products&&Array.isArray(d.products)&&d.products.length>0){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d;}}catch(e){}
    }
  }catch(e){}
  return null;
}

function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
  // 只有使用者有真實資料時才存到雲端（id > 3 代表是使用者自己新增的）
  const hasRealData = state.products.some(p=>p.id>3);
  if(hasRealData){
    saveToCloud(state);

function computeExpiry(p){
  // Priority: openedDate+PAO > mfgDate+PAO > explicit expiryDate > null
  if(p.openedDate&&p.pao){const d=new Date(p.openedDate);d.setMonth(d.getMonth()+parseInt(p.pao));return d;}
  if(p.mfgDate&&p.pao){const d=new Date(p.mfgDate);d.setMonth(d.getMonth()+parseInt(p.pao));return d;}
  if(p.expiryDate)return new Date(p.expiryDate);
  return null;
}
function daysLeft(p){const e=computeExpiry(p);if(!e)return null;return Math.floor((e-new Date())/86400000);}
function expStatus(d){if(d===null)return 'unknown';if(d<0)return 'expired';if(d<=30)return 'danger';if(d<=60)return 'warn';return 'ok';}
function expColor(s){return s==='ok'?'#3A8C6E':s==='warn'?'#A07820':s==='unknown'?'#C4B8B0':'#A84848';}
function expPct(p){const e=computeExpiry(p);if(!e)return 0;const st=p.openedDate?new Date(p.openedDate):p.mfgDate?new Date(p.mfgDate):new Date();return Math.min(100,Math.max(0,Math.round(((new Date()-st)/(e-st))*100)));}
function tagCls(s){return s==='ok'?'tok':s==='warn'||s==='danger'?'twarn':s==='unknown'?'tgray':'tdanger';}
function tagTxt(d){if(d===null)return '未設定效期';if(d<0)return '已過期';if(d<=60)return `距到期日還有 ${d} 天`;return '效期良好';}
const today=()=>new Date().toISOString().split('T')[0];
const fmt=s=>s?s.replace(/-/g,'/'):'—';

async function callClaude(prompt,maxTokens=4096){
  const res=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system:'請使用台灣繁體中文回答，不要使用簡體中文。',messages:[{role:'user',content:prompt}]})});
  if(!res.ok)throw new Error('API '+res.status);
  const data=await res.json();
  if(data.stop_reason&&data.stop_reason!=='end_turn')console.warn('[callClaude] stop_reason:',data.stop_reason);
  return(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
}
function parseJSON(raw){
  const c=raw.replace(/```json|```/g,'').trim();
  function extractFirst(str,open,close){
    const s=str.indexOf(open);
    if(s<0)return null;
    let depth=0,inStr=false,esc=false;
    for(let i=s;i<str.length;i++){
      const ch=str[i];
      if(esc){esc=false;continue;}
      if(ch==='\\'&&inStr){esc=true;continue;}
      if(ch==='"'){inStr=!inStr;continue;}
      if(inStr)continue;
      if(ch===open)depth++;
      else if(ch===close){depth--;if(depth===0)return str.slice(s,i+1);}
    }
    return null;
  }
  const arr=extractFirst(c,'[',']');
  const obj=extractFirst(c,'{','}');
  const arrIdx=arr?c.indexOf(arr[0]):Infinity;
  const objIdx=obj?c.indexOf(obj[0]):Infinity;
  const chosen=arrIdx<=objIdx?arr:obj;
  if(!chosen)throw new Error('No JSON found in response');
  return JSON.parse(chosen);
}

function normCategory(cat){
  if(!cat)return'其他';
  const cats=['化妝水','精華','乳液','乳霜','防曬','潔顏','面膜','美容儀器','其他'];
  const exact=cats.find(c=>c===cat);
  if(exact)return exact;
  const partial=cats.find(c=>cat.includes(c)||c.includes(cat));
  if(partial)return partial;
  if(cat.includes('toner')||cat.includes('lotion')&&cat.length<8)return'化妝水';
  if(cat.includes('serum')||cat.includes('essence'))return'精華';
  if(cat.includes('cream')||cat.includes('moisturizer'))return'乳霜';
  if(cat.includes('sunscreen')||cat.includes('spf'))return'防曬';
  if(cat.includes('cleanser')||cat.includes('wash'))return'潔顏';
  if(cat.includes('mask'))return'面膜';
  if(cat.includes('device')||cat.includes('tool')||cat.includes('儀'))return'美容儀器';
  return'其他';
}

function compressImage(dataUrl,maxSize,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxSize||h>maxSize){if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}else{w=Math.round(w*maxSize/h);h=maxSize;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>reject(new Error('Image load failed'));
    img.src=dataUrl;
  });
}

function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  console.log('[handlePhoto] file selected:',file.name,file.type,file.size);
  const reader=new FileReader();
  reader.onload=async ev=>{
    console.log('[handlePhoto] FileReader loaded, compressing...');
    let compressed;
    try{
      compressed=await compressImage(ev.target.result,800,0.75);
      console.log('[handlePhoto] compressed size:',compressed.length);
    }catch(compErr){
      console.error('[handlePhoto] compressImage failed, using original:',compErr);
      compressed=ev.target.result;
    }
    currentImgData=compressed;
    const base64=compressed.split(',')[1],mime='image/jpeg';
    console.log('[handlePhoto] base64 length:',base64.length);
    const ua=document.querySelector('.upload-area');
    if(ua)ua.innerHTML=`<input type="file" accept="image/*" onchange="handlePhoto(event)"><img src="${compressed}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px;">`;
    const ps=document.getElementById('photo-status');
    if(ps)ps.innerHTML=`<div class="sbox sloading">AI 辨識中 <span class="dot-anim">●</span></div>`;
    console.log('[handlePhoto] firing /api/upload + /api/claude in parallel...');
    try{
      const [uploadResult,claudeResult]=await Promise.allSettled([
        fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageData:base64,mimeType:mime})}).then(r=>{console.log('[upload] HTTP status:',r.status);return r.json();}),
        fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:500,system:'請使用台灣繁體中文回答，不要使用簡體中文。',messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:base64}},{type:'text',text:'辨識此保養品或美容儀器。如果有官方中文品名，name請優先使用中文。只回純JSON：{"brand":"","name":"","category":"","pao":12,"emoji":"","advice":"1-2句","ingredients":""}'}]}]})}).then(r=>{console.log('[claude] HTTP status:',r.status);return r.json();})
      ]);
      console.log('[handlePhoto] uploadResult:',uploadResult.status, uploadResult.status==='fulfilled'?uploadResult.value:uploadResult.reason);
      console.log('[handlePhoto] claudeResult:',claudeResult.status);
      if(uploadResult.status==='fulfilled'&&uploadResult.value.url){window._photoUrl=uploadResult.value.url;console.log('[handlePhoto] photoUrl set:',window._photoUrl);}
      else{console.warn('[handlePhoto] upload failed or no url, imgUrl will be null');}
      if(claudeResult.status!=='fulfilled')throw new Error('AI error: '+claudeResult.reason);
      const info=JSON.parse((claudeResult.value.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').replace(/```json|```/g,'').trim());
      window._photoInfo=info;
      const formBody2=document.getElementById('add-form-body');
      if(formBody2){formBody2.innerHTML=buildProductForm(info);}
      if(ps)ps.innerHTML=`<div class="sbox ssuccess">✓ 辨識完成${window._photoUrl?'，照片已上傳':'（照片上傳失敗，僅保存辨識結果）'}</div>`;
      checkAddBtn();onCatChange();
    }catch(err){
      console.error('[handlePhoto] error:',err);
      if(ps)ps.innerHTML=`<div class="sbox swarn">辨識失敗，請手動填寫</div>`;
    }
  };
  reader.readAsDataURL(file);
}

// 找到產品物件（支援模糊比對名稱）
function findProduct(name){
  if(!name)return null;
  const n=name.trim().toLowerCase();
  const prods=state.products.filter(p=>p.category!=='美容儀器');
  let best=null,bestScore=-1;
  const scores=[];
  for(const p of prods){
    const pn=p.name.trim().toLowerCase();
    const full=(p.brand.trim()+' '+p.name.trim()).toLowerCase();
    let score=0;
    if(n===pn||n===full) score=100;
    else if(n.includes(full)&&full.length>3) score=80+full.length;
    else if(n.includes(pn)&&pn.length>3) score=60+pn.length;
    else if(pn.includes(n)&&n.length>4) score=40+n.length;
    scores.push({name:p.brand+' '+p.name,score});
    if(score>bestScore){bestScore=score;best=p;}
  }
  console.log('[findProduct] input:',JSON.stringify(name));
  console.log('[findProduct] scores:',scores.filter(s=>s.score>0).sort((a,b)=>b.score-a.score));
  console.log('[findProduct] result:',best?best.brand+' '+best.name:'null');
  return bestScore>0?best:null;
}

      <div class="lifestyle-row">
        <div class="lifestyle-label">幾點睡覺</div>
        <select class="lifestyle-select" onchange="setLifestyle('sleepTime',this.value)">${sleepOpts.map(t=>`<option${l.sleepTime===t?' selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="lifestyle-row">
        <div class="lifestyle-label">早上保養後是否需要上妝</div>
        <div class="opt-grid"><button class="opt-btn ${l.makeup===true?'sel':''}" onclick="setLifestyle('makeup',true)">是</button><button class="opt-btn ${l.makeup===false?'sel':''}" onclick="setLifestyle('makeup',false)">否</button></div>
      </div>
      <div class="lifestyle-row">
        <div class="lifestyle-label">工作環境</div>
        <div class="opt-grid3">${['室內冷氣房','戶外日曬','混合'].map(e=>`<button class="opt-btn ${l.environment===e?'sel':''}" onclick="setLifestyle('environment','${e}')">${e}</button>`).join('')}</div>
      </div>
      <div class="lifestyle-row">
        <div class="lifestyle-label">是否有規律運動習慣</div>
        <div class="opt-grid"><button class="opt-btn ${l.exercise===true?'sel':''}" onclick="setLifestyle('exercise',true)">是</button><button class="opt-btn ${l.exercise===false?'sel':''}" onclick="setLifestyle('exercise',false)">否</button></div>
      </div>
      <div class="lifestyle-section-title">肌膚敏感程度</div>
      <div class="opt-grid3">${['不敏感','偶爾敏感','容易敏感'].map(s=>`<button class="opt-btn ${l.sensitivity===s?'sel':''}" onclick="setLifestyle('sensitivity','${s}')">${s}</button>`).join('')}</div>
      <div class="lifestyle-section-title">保養時間</div>
      <div class="lifestyle-row">
        <div class="lifestyle-label">早上可花多少時間</div>
        <div class="opt-grid3">${['5分鐘以內','5-10分鐘','10分鐘以上'].map(m=>`<button class="opt-btn ${l.morningTime===m?'sel':''}" onclick="setLifestyle('morningTime','${m}')">${m}</button>`).join('')}</div>
      </div>
      <div class="lifestyle-row">
        <div class="lifestyle-label">晚上可花多少時間</div>
        <div class="opt-grid3">${['10分鐘以內','10-20分鐘','20分鐘以上'].map(m=>`<button class="opt-btn ${l.eveningTime===m?'sel':''}" onclick="setLifestyle('eveningTime','${m}')">${m}</button>`).join('')}</div>
      </div>
    </div>
    <button class="save-btn" onclick="saveSkin()">✓ 儲存並更新建議</button>
    <div id="skin-advice" style="margin-top:12px;">${(()=>{const cached=state.skinAdvice&&state.skinAdvice.length?state.skinAdvice:loadSkinAdviceCache();if(cached){if(!state.skinAdvice)state.skinAdvice=cached;return renderSkinAdviceHtml(cached);}return'';})()}</div>
    <div class="card" style="margin-top:16px;">
      <div class="card-title">每日提醒設定</div>
      <div class="reminder-row">
        <div><div class="reminder-label">早間保養提醒</div><div class="reminder-sub">提醒早間保養行程</div></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="time" class="time-input" id="morning-time" value="${r.morningTime}" onchange="saveReminderTime()">
          <button class="toggle ${r.morningEnabled?'on':''}" onclick="toggleReminder('morning')"></button>
        </div>
      </div>
      <div class="reminder-row">
        <div><div class="reminder-label">晚間保養提醒</div><div class="reminder-sub">提醒晚間保養行程</div></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="time" class="time-input" id="evening-time" value="${r.eveningTime}" onchange="saveReminderTime()">
          <button class="toggle ${r.eveningEnabled?'on':''}" onclick="toggleReminder('evening')"></button>
        </div>
      </div>
      <div class="reminder-row">
        <div><div class="reminder-label">效期到期提醒</div><div class="reminder-sub">產品 7 天內到期時通知</div></div>
        <button class="toggle ${r.expiryEnabled?'on':''}" onclick="toggleReminder('expiry')"></button>
      </div>
      <div id="notif-status" style="margin-top:4px;"></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="card-title">資料備份</div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:12px;line-height:1.6;">定期匯出備份，避免資料遺失。匯入時會覆蓋現有資料。</div>
      <div style="display:flex;gap:8px;">
        <button class="submit-btn" style="flex:1;" onclick="exportBackup()">匯出備份</button>
        <button class="ghost-btn" style="flex:1;margin-top:0;" onclick="document.getElementById('import-input').click()">匯入備份</button>
      </div>
      <input type="file" id="import-input" accept=".json" style="display:none;" onchange="importBackup(event)">
      <button id="cloud-load-btn" class="ghost-btn" style="margin-top:8px;" onclick="manualLoadFromCloud()">從雲端重新載入資料</button>
      <div id="backup-status" style="margin-top:8px;"></div>
    </div>`;
}
function setSkinType(t){state.skin.type=t;saveState();render();}
function toggleConcern(c){const i=state.skin.concerns.indexOf(c);if(i>=0)state.skin.concerns.splice(i,1);else state.skin.concerns.push(c);saveState();render();}
function setLifestyle(field,val){if(!state.lifestyle)state.lifestyle={};state.lifestyle[field]=val;saveState();render();}
function lifestyleContext(){
  const l=state.lifestyle;
  if(!l)return '生活作息資訊未設定';
  return [
    `起床時間：${l.wakeTime||'未設定'}`,
    `睡覺時間：${l.sleepTime||'未設定'}`,
    `早上保養後${l.makeup?'需要':'不需要'}上妝`,
    `工作環境：${l.environment||'未設定'}`,
    l.exercise?'有規律運動習慣':'無規律運動習慣',
    `肌膚敏感程度：${l.sensitivity||'未設定'}`,
    `早上可花保養時間：${l.morningTime||'未設定'}`,
    `晚上可花保養時間：${l.eveningTime||'未設定'}`
  ].join('\n');
}

function exportBackup(){
  try{
    const exportData={
      ...state,
      products:state.products.map(p=>{const{imgData,...rest}=p;return rest;})
    };
    const data=JSON.stringify(exportData,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const date=new Date().toISOString().split('T')[0];
    a.href=url;a.download=`skincarevault_backup_${date}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const el=document.getElementById('backup-status');
    if(el)el.innerHTML=`<div class="sbox ssuccess">✓ 備份已下載！（不含照片，檔案較小）</div>`;
  }catch(e){
    const el=document.getElementById('backup-status');
    if(el)el.innerHTML=`<div class="sbox swarn">匯出失敗，請再試一次</div>`;
  }
}

function importBackup(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.products||!Array.isArray(data.products))throw new Error('格式錯誤');
      if(!confirm(`確定要匯入備份嗎？\n這將覆蓋現有的 ${state.products.length} 個產品資料，匯入後將有 ${data.products.length} 個產品。`))return;
      state={...DEFAULT,...data};
      if(!state.reminders)state.reminders=JSON.parse(JSON.stringify(DEFAULT.reminders));
if(!state.lifestyle)state.lifestyle=JSON.parse(JSON.stringify(DEFAULT.lifestyle));
      state.products=state.products.map(p=>({mfgDate:'',expiryDate:'',...p}));
      // 先存本地
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
      render();
      // 強制存到雲端，不管有沒有真實資料
      const el=document.getElementById('backup-status');
      if(el)el.innerHTML=`<div class="sbox sloading">正在儲存到雲端... <span class="dot-anim">●</span></div>`;
      const stateToSave = {
  ...state,
  products: state.products.map(p => { const {imgData, ...rest} = p; return rest; })
};
saveToCloud(stateToSave).then(()=>{
        if(el)el.innerHTML=`<div class="sbox ssuccess">✓ 成功匯入 ${data.products.length} 個產品並已存到雲端！</div>`;
      }).catch(()=>{
        if(el)el.innerHTML=`<div class="sbox ssuccess">✓ 成功匯入 ${data.products.length} 個產品！（雲端同步失敗，請重試）</div>`;
      });
    }catch(err){
      const el=document.getElementById('backup-status');
      if(el)el.innerHTML=`<div class="sbox swarn">匯入失敗，請確認檔案格式正確</div>`;
    }
  };
  reader.readAsText(file);
  e.target.value='';
}
async function saveSkin(){
  saveState();clearAdviceCache();saveToCloud(state);
  const el=document.getElementById('skin-advice');
  el.innerHTML=`<div class="sbox sloading">AI 生成個人化建議 <span class="dot-anim">●</span></div>`;
  const prods=state.products.map(p=>`${p.brand} ${p.name}（${p.category}）`).join('、');
  try{
    const raw=await callClaude(`使用者是${state.skin.type}，困擾：${state.skin.concerns.join('、')}。保養品：${prods}。給3點核心保養建議，不得含任何 emoji，只回純JSON：[{"title":"","body":"1-2句"}]`);
    const advices=parseJSON(raw);
    state.skinAdvice=advices;
    saveSkinAdviceCache(advices);
    saveState();
    el.innerHTML=renderSkinAdviceHtml(advices);
  }catch(e){console.error('[saveSkin]',e);el.innerHTML=`<div class="sbox swarn">生成失敗：${e.message}，請再試一次</div>`;}
}

function saveReminderTime(){
  const mt=document.getElementById('morning-time'),et=document.getElementById('evening-time');
  if(mt)state.reminders.morningTime=mt.value;
  if(et)state.reminders.eveningTime=et.value;
  saveState();
}
async function toggleReminder(type){
  const key=type+'Enabled';
  state.reminders[key]=!state.reminders[key];
  if(state.reminders[key]){
    await requestNotifPermission();
  }
  saveState();render();
}
async function requestNotifPermission(){
  if(!('Notification' in window)){
    alert('請先將 SkincareVault 加入主畫面，再開啟通知功能');
    return false;
  }
  if(Notification.permission==='granted')return true;
  const perm=await Notification.requestPermission();
  if(perm==='granted'){
    setTimeout(()=>new Notification('SkincareVault',{body:'通知設定成功！你將收到保養提醒',icon:'/icon-192.png'}),500);
    return true;
  }
  return false;
}
function checkExpiryNotifications(){
  if(!state.reminders.expiryEnabled)return;
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  state.products.forEach(p=>{
    const d=daysLeft(p);
    if(d===null||d<0||d>7)return;
    const key='notif_exp_'+p.id+'_'+d;
    if(!localStorage.getItem(key)){
      new Notification(`⏰ ${p.name} 即將到期`,{body:`還有 ${d} 天！記得盡快使用完畢`,icon:'/icon-192.png'});
      localStorage.setItem(key,'1');
    }
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
}
setTimeout(checkExpiryNotifications,3000);
render();
initFromCloud();

document.addEventListener('click',function(e){
  const delBtn=e.target.closest('[data-del-id]');
  if(delBtn){
    e.stopPropagation();
    const id=parseInt(delBtn.dataset.delId);
    const name=delBtn.dataset.delName;
    if(confirm('確定要刪除「'+name+'」嗎？')){
      state.products=state.products.filter(p=>p.id!==id);
      saveState();render();
    }
    return;
  }
  const pcard=e.target.closest('[data-pid]');
  if(pcard){openDetail(parseInt(pcard.dataset.pid));}
});
</script>
</body>
</html>
